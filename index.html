<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>MOMOwork</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#fff;--pan:#f5f6f8;--pan2:#eceef2;--line:#d6dae0;--ink:#1f2937;--mute:#6b7280;--grey:#808080;--acc:#9D00C2;--acc-l:#f4e3f9;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--blue:#2563eb}
*{box-sizing:border-box;box-shadow:none!important}
html,body{margin:0;height:100%;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus,[contenteditable]:focus{outline:2px solid var(--acc-l);border-color:var(--acc)}
textarea{resize:vertical;width:100%}
.mute{color:var(--mute)} .sp{flex:1} .num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;align-items:center}
.btn{height:30px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--pan)} .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff} .btn.pri:hover{opacity:.9}
.btn.danger{color:var(--err);border-color:#f3c4c4} .btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.x{border:0;background:transparent;cursor:pointer;color:var(--mute);padding:2px 6px;border-radius:4px} .x:hover{background:#fee2e2;color:var(--err)}

/* Header */
header#top{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line);background:#fff;z-index:2000}
.brand{font-weight:900;font-size:19px;letter-spacing:.3px;user-select:none}
.brand .m{color:var(--grey)} .brand .w{color:var(--acc)}
.brand small{font-weight:500;font-size:11px;color:var(--mute);margin-left:8px;letter-spacing:0}
.hbtn{height:32px;min-width:34px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 8px;position:relative;color:var(--ink)}
.hbtn:hover{background:var(--pan)}
#diskBadge{position:absolute;right:-5px;top:-5px;min-width:15px;height:15px;border-radius:8px;font-size:10px;line-height:15px;text-align:center;color:#fff;display:none;padding:0 3px;font-weight:700}
#diskBadge.ok{display:block;background:var(--ok)} #diskBadge.dirty{display:block;background:var(--warn)} #diskBadge.warn{display:block;background:var(--err)}
#saveState{font-size:11px;color:var(--mute);margin-right:4px}
.menu{position:fixed;top:50px;right:8px;width:330px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;z-index:2500;display:none}
.menu.on{display:block}
.mi{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:5px;cursor:pointer}
.mi:hover:not(.row):not([disabled]){background:var(--pan)} .mi small{flex-basis:100%;color:var(--mute);padding-left:24px;font-size:11px}
.mi.dis,.mi[disabled]{color:#9aa1ab;cursor:default} .mi.dis:hover{background:transparent}
.mi .chk{color:var(--ok);font-weight:900}
.mi.row{cursor:default;flex-wrap:nowrap} .mi.row input{width:64px}
.minote{font-size:11px;color:var(--mute);padding:2px 8px 6px 32px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Layout */
#app{position:fixed;top:46px;left:0;right:0;bottom:0;display:flex}
#tools{width:138px;flex:none;border-right:1px solid var(--line);background:var(--pan);overflow:auto;padding:6px}
.tsec{border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px;margin-bottom:6px}
.tsec h4{margin:0 0 4px;font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tb{height:38px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;padding:0;line-height:1}
.tb small{font-size:8.5px;color:var(--mute);margin-top:3px;white-space:nowrap}
.tb:hover{background:var(--pan)} .tb.on{background:var(--acc-l);border-color:var(--acc)} .tb.on small{color:var(--acc)}
.tb.txt{font-size:11px;font-weight:600}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#fbar{display:flex;gap:5px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fff}
.tag{height:26px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px}
.tag .dot{width:9px;height:9px;border-radius:50%}
.tag.off{opacity:.38;text-decoration:line-through}
#search{width:200px;height:26px}
#count{font-size:12px;color:var(--mute)}
.view{flex:1;position:relative;overflow:auto;display:none} .view.on{display:block}
#v-map{overflow:hidden} #map{position:absolute;inset:0}
#modeHint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;border-radius:6px;z-index:800;font-size:12px;display:none}
.pin{background:none;border:0} .pin svg{position:absolute;left:0;top:0} .pin .pe{position:absolute;left:0;top:7px;width:34px;text-align:center;font-size:15px;line-height:18px}
.leaflet-tooltip,.leaflet-popup-content-wrapper{border:1px solid var(--line);border-radius:6px}
.mlabel{background:#fff;border:1px solid var(--acc);color:var(--acc);font-weight:700;font-size:11px;padding:2px 6px}
.leaflet-container{font:inherit}

/* Drawer */
#drawer{position:absolute;top:0;left:0;bottom:0;width:380px;max-width:100%;background:#fff;border-right:1px solid var(--line);z-index:1100;display:none;flex-direction:column}
#drawer.on{display:flex}
.dh{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--pan)}
.dh b{font-size:14px}
.db{flex:1;overflow:auto;padding:10px}
.ctabs{display:flex;gap:4px;margin-bottom:8px}
.ctabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px;cursor:pointer;font-size:12px}
.ctabs button.on{border-color:var(--acc);background:var(--acc-l);color:var(--acc);font-weight:600}
.contact{border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:6px;display:flex;gap:8px}
.contact .ci{flex:1;min-width:0} .contact .ci div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{border:0;background:none;cursor:pointer;font-size:16px;padding:0}
.lien{display:block;color:#fff;text-decoration:none;font-weight:700;padding:11px 14px;border-radius:6px;margin-bottom:6px}
.lien:hover{opacity:.88}

/* Lists */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);text-align:left;padding:6px;border-bottom:1px solid var(--line);font-weight:600;background:var(--pan)}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--pan2);vertical-align:middle}
.tbl td input,.tbl td select{width:100%;padding:4px 6px}
.tbl input.w4{width:56px} .tbl input.w6{width:76px} .tbl input.w7{width:92px}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--pan)}
.tbl .empty{text-align:center;color:var(--mute);padding:14px}
.tbl tr.st-retenu td{background:#ecfdf3} .tbl tr.st-ecarte td{opacity:.5}
.listwrap{padding:12px}
.bar{height:6px;background:var(--pan2);border-radius:3px;overflow:hidden;width:90px} .bar i{display:block;height:100%;background:var(--acc)}
.jb{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;border:1px solid var(--line)}
.jb.late{background:#fee2e2;color:var(--err);border-color:#fecaca} .jb.soon{background:#fef3c7;color:var(--warn);border-color:#fde68a} .jb.ok{background:#ecfdf3;color:var(--ok);border-color:#bbf7d0} .jb.done{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
.agenda{max-width:820px;margin:0 auto;padding:16px}
.agi{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:6px;cursor:pointer;background:#fff}
.agi:hover{background:var(--pan)} .agi.late{border-color:#fecaca;background:#fff7f7}
.agline{display:flex;align-items:center;gap:8px;margin:14px 0;color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.agline:before,.agline:after{content:"";flex:1;height:2px;background:var(--acc)}

/* Rapport */
#rapport{position:fixed;top:46px;left:0;right:0;bottom:0;background:#fff;z-index:1500;display:none;flex-direction:column}
#rapport.on{display:flex}
#rhead{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rpin{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.rtitle{font-size:17px;font-weight:700;border-color:transparent;width:340px;max-width:100%}
.rtitle:hover{border-color:var(--line)}
.lbl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute)}
.pill{width:32px;height:30px;border:1px solid var(--line);border-radius:15px;background:#fff;cursor:pointer;filter:grayscale(1);opacity:.55}
.pill.on-av{filter:none;opacity:1;background:#e6f6f7;border-color:#0E7C86}
.pill.on-rep{filter:none;opacity:1;background:#ecfdf3;border-color:var(--ok)}
.rbody{flex:1;display:flex;min-height:0}
#rnav{width:200px;flex:none;border-right:1px solid var(--line);background:var(--pan);padding:8px;overflow:auto}
.rn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;padding:8px;border-radius:6px;cursor:pointer;text-align:left;margin-bottom:2px}
.rn:hover{background:#fff;border-color:var(--line)} .rn.on{background:#fff;border-color:var(--acc);color:var(--acc);font-weight:600}
.rn .sd{margin-left:auto;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.sd.prog{background:#fde68a;border-color:var(--warn)} .sd.done{background:var(--ok);border-color:var(--ok)}
#rcontent{flex:1;overflow:auto;padding:14px 18px 40px}
.tabhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tabhead>div:first-child{flex:1;min-width:240px}
.tabhead h2{margin:0;font-size:18px} .tabhead p{margin:3px 0 0}
.stepbtn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 14px;cursor:pointer}
.stepbtn.done{background:#ecfdf3;border-color:var(--ok);color:var(--ok);font-weight:700}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:#fff}
.cardh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cardh b{font-size:13.5px}
.cattitle{font-weight:700;font-size:14px;border-color:transparent;width:260px} .cattitle:hover{border-color:var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.c2{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:3px}
.f>span{font-size:11px;color:var(--mute);font-weight:600}
.f .row input{flex:1}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:2px}
.radios{display:flex;flex-wrap:wrap;gap:6px 16px}
.radios label{display:flex;gap:5px;align-items:center;cursor:pointer}
.typo{display:flex;gap:8px;flex-wrap:wrap}
.typo label{border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.typo label:has(input:checked){border-color:var(--acc);background:var(--acc-l)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:5px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on.oui{background:#ecfdf3;color:var(--ok);font-weight:700} .seg button.on.non{background:var(--pan2);font-weight:700} .seg button.on.nc{background:#fef3c7;color:var(--warn);font-weight:700}
.totbar{text-align:right;font-size:14px;margin:6px 0 0} .totbar b{color:var(--acc);font-size:16px}
.rte{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rtebar{display:flex;gap:2px;padding:3px;border-bottom:1px solid var(--line);background:var(--pan)}
.rtebar button{border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 8px;cursor:pointer}
.rtebar button:hover{background:#fff;border-color:var(--line)}
.rted{min-height:90px;padding:8px 10px;outline:none} .rted.big{min-height:320px}
.rted:empty:before{content:attr(data-ph);color:#aab}
/* Synthèse */
.pipe{display:flex;align-items:stretch;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.stp{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.stp .si{font-size:18px} .stp small{color:var(--mute)}
.stp.done{border-color:var(--ok);background:#f2fbf5} .stp.done small{color:var(--ok);font-weight:700}
.stp.prog{border-color:var(--warn);background:#fffaf0} .stp.prog small{color:var(--warn);font-weight:700}
.arr{align-self:center;color:var(--mute);font-size:18px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sgrid .card{margin:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--pan2)} .kv span{color:var(--mute)}
.big-ech{font-size:22px;font-weight:800}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:12px;display:inline-flex;gap:5px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.met{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:0 4px 4px 0;min-width:72px}
.met span{font-size:20px}
.dclist .kv b{color:var(--acc)}
/* Documents */
#drop{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--mute);margin-top:10px}
#drop.over{border-color:var(--acc);background:var(--acc-l);color:var(--acc)}
.fname{font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
/* Chrono */
.tl{position:relative;display:flex;gap:26px;overflow-x:auto;padding:10px 10px 6px;min-height:150px;align-items:center}
.tlline{position:absolute;left:0;right:0;top:50%;height:3px;background:var(--line)}
.tln{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;width:96px}
.tli{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:19px}
.tln:hover .tli{background:var(--acc-l)}
.tln.plus .tli{background:var(--acc);color:#fff;font-size:22px;width:50px;height:50px}
.tlt{font-size:11.5px;font-weight:600;text-align:center;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:16px}
.tld{font-size:11px;color:var(--mute)}
.todo{display:flex;gap:6px;align-items:center;margin-bottom:4px} .todo .tt{flex:1}
.todo.done .tt,.todo.done span{text-decoration:line-through;color:var(--mute)}
/* Admin */
.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.subt{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
.subt small{color:var(--mute);margin-left:4px}
.subt.on{border-color:var(--acc);background:var(--acc-l);color:var(--acc);font-weight:700}
.subt.add{border-style:dashed}
.dcsec{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.dcst{background:var(--pan);padding:7px 10px;font-weight:700;border-bottom:1px solid var(--line)}
.dcst span{display:inline-block;background:var(--acc);color:#fff;border-radius:4px;padding:0 7px;margin-right:6px}
.dcsec .fgrid{padding:10px}
.calc{padding:6px 8px;background:var(--pan);border-radius:5px;font-weight:700}
.note{font-size:12px;color:var(--mute);font-style:italic}
.mapu{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-color:#f5c89a;background:#fffaf5}
.mapulogo{font-size:28px}

/* Modal */
.mw-modal{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:3000;display:flex;align-items:center;justify-content:center;padding:14px}
.mw-modal .box{background:#fff;border:1px solid var(--line);border-radius:10px;width:480px;max-width:100%;max-height:92vh;display:flex;flex-direction:column}
.mw-modal .box.wide{width:820px}
.mh{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)} .mh b{flex:1;font-size:15px}
.mb{padding:14px;overflow:auto} .mb p{margin:0 0 8px}
.mf{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.guide h3{margin:14px 0 4px;color:var(--acc);font-size:14px} .guide p,.guide li{color:#374151}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:4000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px}
.toast.err{background:var(--err)} .toast.ok{background:var(--ok)}

/* Splash */
#splash{position:fixed;inset:0;background:#fff;z-index:5000;display:flex;align-items:center;justify-content:center;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(260px,55vw);overflow:visible}
#splash .m1{animation:mTop .9s cubic-bezier(.2,.8,.2,1) both}
#splash .m2{animation:mBot .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes mTop{from{transform:translateY(-700px);opacity:0}to{transform:none;opacity:1}}
@keyframes mBot{from{transform:translateY(700px);opacity:0}to{transform:none;opacity:1}}
#splash .fl{transform-box:fill-box;transform-origin:50% 100%;animation:floor .42s cubic-bezier(.3,1.5,.5,1) both}
#splash .fl1{animation-delay:.95s} #splash .fl2{animation-delay:1.25s} #splash .fl3{animation-delay:1.55s} #splash .fl4{animation-delay:1.85s}
@keyframes floor{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#splash .crane{animation:crane 2.4s linear both}
@keyframes crane{0%,35%{opacity:0}45%{opacity:1}90%{opacity:1}100%{opacity:0}}
#splash .sub{font:600 58px system-ui;fill:var(--mute);letter-spacing:3px;animation:fadeIn .5s 2.2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;font-size:11px}
}
.pdoc h1{font-size:17px;margin:0} .pdoc h2{font-size:13px;margin:14px 0 5px;color:var(--acc);border-bottom:1.5px solid var(--acc);padding-bottom:2px}
.pdoc table{width:100%;border-collapse:collapse;margin:4px 0} .pdoc td,.pdoc th{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top} .pdoc th{background:#f1f1f1}
.pdoc .phead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.pdoc .pbrand{font-weight:900;font-size:16px} .pdoc .pbrand b{color:var(--acc)}
.pdoc .dch{display:flex;gap:12px;align-items:center;border:2px solid #000;padding:8px;margin-bottom:10px}
.pdoc .dcbadge{font-size:26px;font-weight:900;border-right:2px solid #000;padding-right:12px}
.pdoc .dcsup{font-size:10px;letter-spacing:2px}
.pdoc .dcsec{border:1px solid #000;border-radius:0;margin-bottom:8px;page-break-inside:avoid}
.pdoc .dcst{background:#e9e9e9;border-bottom:1px solid #000;padding:4px 8px}
.pdoc .dcst span{background:#000}

function entIdent(){const E=IDX.entreprise||{};return [E.raison,E.adresse,[E.cp,E.ville].filter(Boolean).join(' '),E.siret?'SIRET : '+E.siret:'',[E.tel,E.mail].filter(Boolean).join(' — ')].filter(Boolean).join('\n')}
function pre(src,a,ctx){
  if(!src)return undefined;
  if(src==='today')return todayISO();
  if(src[0]==='=')return src==='=1'?true:src.slice(1);
  const E=IDX.entreprise||{};const i=src.indexOf(':');const ns=src.slice(0,i),k=src.slice(i+1);
  if(ns==='ent'){if(k==='ident')return entIdent();if(k==='adrFull')return [E.adresse,[E.cp,E.ville].filter(Boolean).join(' ')].filter(Boolean).join('\n');if(k==='ca'||k==='eff')return clone(E[k]);return E[k]||''}
  if(ns==='aff'){const d=a.deno;if(k==='acheteur')return [d.client.societe,d.client.adresse].filter(Boolean).join('\n');if(k==='objet')return d.nom+(d.adresse?' — '+d.adresse:'');if(k==='montant'){const m=metreTotal(a);return m?String(Math.round(m*100)/100):(d.montant||'')}return d[k]||''}
  if(ns==='st')return (ctx&&ctx[k])||'';
}
function dcPctOf(a,kind,i){const sch=DCS[kind];const v=kind==='dc4'?a.dc.dc4[i]:a.dc[kind];if(!v)return 0;const fs=sch.f.filter(f=>f[0]!=='S'&&f[2]!=='calc'&&f[2]!=='note');const n=fs.filter(f=>dcFilled(v[f[0]])).length;return Math.round(100*n/fs.length)}

const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('MOMOwork',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('aff')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode);const r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  get(st,k){return this.tx(st,'readonly',s=>s.get(k))},set(st,k,v){return this.tx(st,'readwrite',s=>s.put(v,k))},del(st,k){return this.tx(st,'readwrite',s=>s.delete(k))},clear(st){return this.tx(st,'readwrite',s=>s.clear())}};

async function saveAll(silent){
  if(saving)return false;
  if(Store.mode==='folder'&&!Store.granted){if(silent){updSaveUI();return false}if(!await Store.ensure())return false}
  saving=true;
  try{
    for(const id of [...DIRTY]){const a=CACHE.get(id);if(a)await Store.saveAff(id,a);DIRTY.delete(id)}
    IDX.savedAt=new Date().toISOString();await Store.saveIndex(IDX);IDXDIRTY=false;LASTSAVE=new Date();evictClean();
    return true;
  }catch(e){console.error(e);toast('Échec de la sauvegarde : '+e.message,'err');return false}
  finally{saving=false;updSaveUI()}
}
async function buildBundle(){
  const affaires={};

  return {app:'MOMOwork-bundle',v:1,date:new Date().toISOString(),index:IDX,affaires};
}

function initMap(){

function pinStyle(s){if(s.avalider)return {c:'#F4C20D',e:'🔍'};if(s.etat==='ao'&&s.repondu)return {c:'#38BDF8',e:'🕑'};return ETATS[s.etat]||ETATS.ao}

  if(s.etat==='ao'){const c=FILT.ao;if(c===4)return false;if(c===1)return !s.repondu&&!s.avalider;if(c===2)return s.avalider;if(c===3)return s.repondu;return true}

async function mapClick(e){

  if(MODE==='place'){setMode(null);newAffaireDialog({lat:ll.lat,lng:ll.lng});return}

  if(MODE==='dist'||MODE==='area'){if(!DRAW)DRAW={type:MODE,pts:[]};const p=[ll.lat,ll.lng],last=DRAW.pts[DRAW.pts.length-1];if(!last||MAP.distance(last,p)>0.01)DRAW.pts.push(p);drawTemp()}

function mapDbl(){if(!DRAW)return;const n=DRAW.pts.length;if((DRAW.type==='dist'&&n>=2)||(DRAW.type==='area'&&n>=3)){IDX.annots.push({id:uid('M-'),type:DRAW.type,pts:DRAW.pts});markIdx();renderAnnots()}DRAW=null;TEMP.clearLayers()}
function drawTemp(){TEMP.clearLayers();if(!DRAW)return;const s={color:'#9D00C2',weight:2,dashArray:'5 5'};if(DRAW.type==='area'&&DRAW.pts.length>2)L.polygon(DRAW.pts,s).addTo(TEMP);else L.polyline(DRAW.pts,s).addTo(TEMP);DRAW.pts.forEach(p=>L.circleMarker(p,{radius:3,color:'#9D00C2'}).addTo(TEMP))}
const toRad=x=>x*Math.PI/180;

const lenOf=(pts,close)=>{let d=0;for(let i=1;i<pts.length;i++)d+=MAP.distance(pts[i-1],pts[i]);if(close&&pts.length>2)d+=MAP.distance(pts[pts.length-1],pts[0]);return d};
const fmtLen=m=>m<1000?qfmt(m)+' m':(m/1000).toLocaleString('fr-FR',{maximumFractionDigits:3})+' km';
function renderAnnots(){if(!ANNOT)return;ANNOT.clearLayers();IDX.annots.forEach(a=>{const st={color:'#9D00C2',weight:2.5,fillOpacity:.12};const l=a.type==='area'?L.polygon(a.pts,st):L.polyline(a.pts,st);const lab=a.type==='area'?`${Math.round(geoArea(a.pts)).toLocaleString('fr-FR')} m² · P ${fmtLen(lenOf(a.pts,true))}`:fmtLen(lenOf(a.pts));l.bindTooltip(lab,{permanent:true,className:'mlabel',direction:'center'});l.on('click',ev=>{if(MODE==='erase'){L.DomEvent.stop(ev);IDX.annots=IDX.annots.filter(x=>x.id!==a.id);markIdx();renderAnnots()}});ANNOT.addLayer(l)})}
async function geocode(q){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(q));const j=await r.json();return j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null}catch(e){return null}}
async function revGeo(lat,lng){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`);const j=await r.json();const a=j.address||{};return [[a.house_number,a.road].filter(Boolean).join(' '),[a.postcode,a.city||a.town||a.village||a.municipality].filter(Boolean).join(' ')].filter(Boolean).join(', ')||j.display_name||''}catch(e){return ''}}

  <div class="tsec"><h4>Mesures</h4><div class="tgrid">${tb('m:dist','📏','Cote',MODE==='dist')}${tb('m:area','⬠','Aire',MODE==='area')}${tb('m:erase','⌫','Gomme',MODE==='erase')}</div></div>

$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;const [k,v]=b.dataset.tool.split(':');

/* ============ Liste & Agenda ============ */
function jBadge(s){if(s.repondu)return '<span class="jb done">Répondu</span>';const j=daysTo(s.echeance);if(j==null)return '<span class="mute">—</span>';if(j<0)return `<span class="jb late">Dépassée (${-j} j)</span>`;if(j===0)return '<span class="jb late">Aujourd\u2019hui</span>';return `<span class="jb ${j<=7?'soon':'ok'}">J-${j}</span>`}
function renderList(){
  const rows=IDX.affaires.filter(visible).sort((a,b)=>(a.echeance||'9999').localeCompare(b.echeance||'9999')||a.nom.localeCompare(b.nom));
  $('#v-list').innerHTML=`<div class="listwrap"><table class="tbl"><thead><tr><th></th><th>Affaire</th><th>Client</th><th>Adresse</th><th>Échéance</th><th></th><th>Étapes</th><th>Docs</th><th>Modifiée</th></tr></thead><tbody>${rows.map(s=>{const st=pinStyle(s);const p=s.steps?Math.round(100*s.steps.done/s.steps.total):0;return `<tr class="click" data-open="${s.id}"><td><span class="rpin" style="background:${st.c};width:26px;height:26px;font-size:13px">${st.e}</span></td><td><b>${esc(s.nom)}</b>${s.ref?`<br><small class="mute">${esc(s.ref)}</small>`:''}</td><td>${esc(s.client||'')}</td><td><small>${esc(s.adresse||'')}</small></td><td>${fmtD(s.echeance)}</td><td>${jBadge(s)}</td><td><div class="bar"><i style="width:${p}%"></i></div><small class="mute">${s.steps?.done||0}/${s.steps?.total||6}</small></td><td>${s.docs?.total?`${s.docs.ok}/${s.docs.total}`:'—'}</td><td><small class="mute">${fmtD(s.updated?.slice(0,10))}</small></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Aucune affaire. Utilisez ＋ Nouvelle ou 📍 Placer.</td></tr>'}</tbody></table></div>`;
}
function renderAgenda(){
  const L0=IDX.affaires.filter(s=>s.echeance&&!s.repondu&&!['termine','sanssuite'].includes(s.etat)&&visible(s));
  const past=L0.filter(s=>daysTo(s.echeance)<0).sort((a,b)=>a.echeance.localeCompare(b.echeance));
  const fut=L0.filter(s=>daysTo(s.echeance)>=0).sort((a,b)=>a.echeance.localeCompare(b.echeance));
  const item=s=>{const st=pinStyle(s);const j=daysTo(s.echeance);return `<div class="agi ${j<0?'late':''}" data-open="${s.id}"><span class="rpin" style="background:${st.c}">${st.e}</span><div style="flex:1"><b>${esc(s.nom)}</b><div class="mute">${esc(s.client||'')}${s.adresse?' — '+esc(s.adresse):''}</div></div><div style="text-align:right"><div>${fmtD(s.echeance)}</div>${jBadge(s)}</div></div>`};
  $('#v-agenda').innerHTML=`<div class="agenda"><h2 style="margin:0 0 4px">Agenda des remises</h2><p class="mute" style="margin:0 0 10px">Affaires datées non répondues, par priorité. Les échéances dépassées passent au-dessus de la ligne du jour.</p>${past.map(item).join('')}<div class="agline">Aujourd\u2019hui — ${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>${fut.map(item).join('')||'<p class="mute" style="text-align:center">Aucune échéance à venir.</p>'}</div>`;
}

  let data=null;

/* ============ Ouverture / rapport d'affaire ============ */
async function openAffaire(id,tab='rapport'){
  let a=CACHE.get(id);
  if(!a){
    if(Store.mode==='folder'&&!Store.granted&&!await Store.ensure())return;
    try{a=await Store.loadAff(id)}catch(e){console.error(e)}
    if(!a){toast('Fichier de l\u2019affaire introuvable dans la sauvegarde','err');return}
    normAff(a);CACHE.set(id,a);
  }
  A=a;RTAB=tab;showRapport();
}

  if(A&&!force){upsertContact('clients',A.deno.client);A.prix.cats.forEach(c=>c.rows.forEach(r=>{if(r.f)upsertContact('fourn',{societe:r.f})}))}

}

function extractQty(root){
  const Q=[[/^(longueur|length|len|lineaire|linéaire|ml|perimetre|périmètre|distance)$/i,'ml'],[/^(surface|area|aire|m2|superficie)$/i,'m²'],[/^(volume|m3|cubature)$/i,'m³'],[/^(quantite|quantité|quantity|qty|qte|qté|count|nombre|nb)$/i,'u']];
  const LBL=['designation','désignation','libelle','libellé','label','nom','name','titre','title','type','kind','categorie','category'];
  const PU=['pu','prix','price','unitPrice','prixUnitaire','cout','coût','cost'];
  const acc=new Map(),counts=new Map();let seen=0;
  const lab=o=>{for(const k of LBL)if(typeof o[k]==='string'&&o[k].trim())return o[k].trim();return null};
  const walk=(o,depth,pl)=>{if(depth>14||o==null||++seen>300000)return;if(Array.isArray(o)){o.forEach(x=>walk(x,depth+1,pl));return}if(typeof o!=='object')return;
    const own=lab(o),l=own||pl;let hit=false;
    for(const [k,v] of Object.entries(o)){if(typeof v==='number'||(typeof v==='string'&&/^-?\d+([.,]\d+)?$/.test(v.trim()))){for(const [re,u] of Q){if(re.test(k)){const n=num(v);if(n>0&&l){const key=l+'|'+u;const e=acc.get(key)||{des:l,u,q:0,pu:''};e.q+=n;const pk=PU.find(p=>o[p]!=null&&num(o[p])>0);if(pk&&!e.pu)e.pu=num(o[pk]);acc.set(key,e);hit=true}}}}}
    if(!hit&&own&&(('x' in o&&'y' in o)||('lat' in o&&('lng' in o||'lon' in o))))counts.set(own,(counts.get(own)||0)+1);
    for(const v of Object.values(o))if(v&&typeof v==='object')walk(v,depth+1,l)};
  walk(root,0,null);
  counts.forEach((n,l)=>{if(!acc.has(l+'|u'))acc.set(l+'|u',{des:l,u:'u',q:n,pu:''})});
  return [...acc.values()].map(e=>({...e,q:Math.round(e.q*100)/100,src:'map'}));
}
async function applyMapRows(){
  let o;try{o=JSON.parse(A.metre.map.text)}catch(e){toast('Le .map n\u2019est pas un JSON lisible : quantités à saisir à la main','err');return}
  const rows=extractQty(o);
  if(!rows.length){toast('Aucune quantité reconnue dans le .map — saisissez les postes à la main','err');return}
  const manual=A.metre.rows.filter(r=>r.src!=='map');
  const old=new Map(A.metre.rows.filter(r=>r.src==='map').map(r=>[r.des+'|'+r.u,r.pu]));
  rows.forEach(r=>{if(!r.pu&&old.get(r.des+'|'+r.u))r.pu=old.get(r.des+'|'+r.u)});
  A.metre.rows=[...rows,...manual];touch();renderRTab();toast(`${rows.length} poste(s) importé(s) depuis Mapulator`,'ok');
}

    :`<div class="rte"><div class="rtebar"><button data-cmd="bold"><b>G</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>S</u></button><button data-cmd="insertUnorderedList">• Liste</button></div><div class="rted big" contenteditable="true" id="ev-html" data-ph="Collez ou saisissez le texte…">${e.html||''}</div></div>`);
    const add=()=>{const v=$('#ev-new',body).value.trim();if(!v)return;e.items.push({t:v,done:false});touch();draw();$('#ev-new',body).focus()};
    if(e.type==='todo'){$('#ev-add',body).onclick=add;$('#ev-new',body).onkeydown=k=>{if(k.key==='Enter')add()}}};
  body.addEventListener('input',k=>{const t=k.target;if(t.id==='ev-t')e.titre=t.value;else if(t.id==='ev-html')e.html=t.innerHTML;else if(t.classList.contains('tt'))e.items[+t.dataset.i].t=t.value;else return;touch()});
  body.addEventListener('change',k=>{const t=k.target;if(t.type==='checkbox'){e.items[+t.dataset.i].done=t.checked;touch();draw()}});
  body.addEventListener('click',k=>{const d=k.target.closest('[data-del]');if(d){e.items.splice(+d.dataset.del,1);touch();draw()}});
  draw();
  const r=await modal({title:e.type==='todo'?'☑️ To-Do':'📋 Document',body,wide:e.type!=='todo',buttons:[{l:'🗑️ Supprimer',v:'del',cls:'danger'},{l:'🖨️ Imprimer',v:'print'},{l:'Fermer',cls:'pri'}]});
  if(r==='del'&&await appConfirm('Supprimer cet événement ?','Supprimer')){A.events=A.events.filter(x=>x.id!==e.id);touch()}
  if(r==='print')doPrint(`<div class="pdoc">${pHead(e.titre)}<p>${fmtD(e.date)}</p>${e.type==='todo'?`<table>${e.items.map(i=>`<tr><td style="width:24px">${i.done?'☒':'☐'}</td><td>${esc(i.t)}</td></tr>`).join('')}</table>`:e.html}</div>`,e.titre);
  if(A){renderRTab();renderRNav()}
}

/* --- Onglet Administratif DC1–DC4 --- */
function dcCtx(){const [kind,i]=DCTAB.split(':');return {kind,i:i==null?null:+i}}
function dcVals(kind,i){if(kind==='dc4')return A.dc.dc4[i];return A.dc[kind]||(A.dc[kind]={})}
function prefillDC(kind,i,force){const v=dcVals(kind,i),ctx=kind==='dc4'?v._st:null;let n=0;DCS[kind].f.forEach(f=>{if(f[0]==='S'||!f[3]||f[2]==='calc')return;if(force||!dcFilled(v[f[0]])){const p=pre(f[3],A,ctx);if(p!==undefined&&p!==''&&p!==null){v[f[0]]=p;n++}}});return n}
function tabAdmin(){
  let {kind,i}=dcCtx();if(kind==='dc4'&&!A.dc.dc4[i]){DCTAB='dc1';kind='dc1';i=null}
  const v=dcVals(kind,i);if(!v._init){prefillDC(kind,i);v._init=1;touch()}
  const P=kind==='dc4'?`dc.dc4.${i}`:`dc.${kind}`,sch=DCS[kind];
  let h=stepBar('admin','Dossier administratif','Formulaires de candidature pré-remplis depuis la fiche entreprise et l\u2019affaire : DC1, DC2, DC3 (acte d\u2019engagement), DC4 (sous-traitance).');
  h+=`<div class="subnav">${['dc1','dc2','dc3'].map(k=>`<button class="subt ${DCTAB===k?'on':''}" data-act="dctab" data-k="${k}">${DCS[k].t}<small>${dcPctOf(A,k)}%</small></button>`).join('')}${A.dc.dc4.map((x,j)=>`<button class="subt ${DCTAB==='dc4:'+j?'on':''}" data-act="dctab" data-k="dc4:${j}">DC4 · ${esc(x._st?.societe||'sous-traitant')}<small>${dcPctOf(A,'dc4',j)}%</small></button>`).join('')}<button class="subt add" data-act="dc4add">＋ DC4 sous-traitant</button></div>`;
  h+=`<div class="row" style="margin-bottom:10px;flex-wrap:wrap"><b style="font-size:15px">${sch.t} — ${esc(sch.l)}</b><span class="sp"></span><button class="btn" data-act="dcFill">↻ Compléter les champs vides</button><button class="btn" data-act="dcReset" title="Écrase les champs pré-remplissables avec la fiche entreprise / l'affaire">⟲ Tout re-préremplir</button><button class="btn" data-act="entOpen">🏢 Fiche entreprise</button>${kind==='dc4'?'<button class="btn danger" data-act="dc4del">🗑️ Supprimer ce DC4</button>':''}<button class="btn pri" data-act="dcPrint">🖨️ Imprimer / PDF</button></div>`;
  if(!IDX.entreprise.raison)h+=`<div class="card" style="border-color:#fde68a;background:#fffbeb">⚠️ La fiche entreprise est vide : remplissez-la une fois (🏢) pour pré-remplir automatiquement tous les formulaires.</div>`;
  let open=false;

  if(open)h+='</div></div>';
  return h;
}
function dcField(f,P,v){
  const [k,l,t,,x]=f,val=v[k],p=`${P}.${k}`;
  switch(t){
    case 't':return `<label class="f"><span>${esc(l)}</span><input data-b="${p}" value="${esc(val??'')}"></label>`;
    case 'n':return `<label class="f"><span>${esc(l)}</span><input class="num" data-b="${p}" data-rr="calc" value="${esc(val??'')}"></label>`;
    case 'd':return `<label class="f"><span>${esc(l)}</span><input type="date" data-b="${p}" value="${esc(val??'')}"></label>`;
    case 'ta':return `<label class="f c2"><span>${esc(l)}</span><textarea data-b="${p}" rows="${String(val||'').split('\n').length>2?5:3}">${esc(val??'')}</textarea></label>`;
    case 'c':return `<label class="chk c2"><input type="checkbox" data-b="${p}" ${val?'checked':''}><span>${esc(l)}</span></label>`;
    case 'r':return `<div class="f c2"><span>${esc(l)}</span><div class="radios">${x.map(o=>`<label><input type="radio" name="${p}" data-b="${p}" value="${esc(o)}" ${val===o?'checked':''}> ${esc(o)}</label>`).join('')}</div></div>`;
    case 'g':{if(!Array.isArray(val))v[k]=[{},{},{}];const rows=v[k];return `<div class="f c2"><span>${esc(l)}</span><table class="tbl"><thead><tr>${x.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr>${x.map(c=>`<td><input data-b="${p}.${ri}.${c[0]}" value="${esc(r[c[0]]??'')}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    case 'calc':return `<div class="f"><span>${esc(l)}</span><div class="calc" data-calc="${k}"></div></div>`;
    case 'note':return `<div class="note c2">${esc(l)}</div>`;
  }return '';
}
function updCalc(){const {kind,i}=dcCtx();const v=dcVals(kind,i);if(!v)return;$$('[data-calc]').forEach(el=>{const f=DCS[kind].f.find(x=>x[0]===el.dataset.calc);if(f)el.textContent=f[4](v)})}

function printDC(){

    else if(t==='g')h+=`<div class="pf"><div class="pl">${esc(l)}</div><table><tr>${x.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr>${(val||[]).map(r=>`<tr>${x.map(c=>`<td>${esc(r[c[0]]??'')}</td>`).join('')}</tr>`).join('')}</table></div>`;
    else if(t==='calc')h+=`<div class="pf"><div class="pl">${esc(l)}</div><div class="pv">${x(v)}</div></div>`;
    else if(t==='note')h+=`<div class="pf" style="min-height:60px"><i>${esc(l)}</i></div>`;

  doPrint(h,`${sch.t} — ${A.deno.nom}`);
}

  `<h2>Métré${a.metre.map?' — Mapulator : '+esc(a.metre.map.name):''}</h2>${a.metre.rows.length?`<table><tr><th>Désignation</th><th>U</th><th>Quantité</th><th>PU HT</th><th>Total HT</th></tr>${a.metre.rows.map(r=>`<tr><td>${esc(r.des)}</td><td>${esc(r.u)}</td><td>${qfmt(num(r.q))}</td><td>${r.pu?eur(num(r.pu)):''}</td><td>${num(r.q)*num(r.pu)?eur(num(r.q)*num(r.pu)):''}</td></tr>`).join('')}<tr><th colspan="4">Total HT</th><th>${eur(metreTotal(a))}</th></tr></table>`:'<p>Aucun poste.</p>'}`+
  `<h2>Documents liés</h2>${a.docs.length?`<table><tr><th>Catégorie</th><th>Désignation</th><th>Statut</th><th>Attendu pour</th><th>Reçu le</th><th>Note</th></tr>${a.docs.map(x=>`<tr><td>${DOC_CAT[x.cat]||''}</td><td>${esc(x.nom)}${x.file?' 📎':''}</td><td>${DOC_ST[x.st][0]}</td><td>${fmtD(x.pour)}</td><td>${fmtD(x.recu)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table>`:'<p>Aucun document suivi.</p>'}`+
  `<h2>Dossier administratif</h2><table>${['dc1','dc2','dc3'].map(k=>`<tr><th style="width:32%">${DCS[k].t}</th><td>${dcPctOf(a,k)} % renseigné</td></tr>`).join('')}${a.dc.dc4.map((x,i)=>`<tr><th>DC4 — ${esc(x._st?.societe||'')}</th><td>${dcPctOf(a,'dc4',i)} % renseigné</td></tr>`).join('')}</table>`;
  const todos=[];a.events.forEach(e=>{if(e.type==='todo')e.items.forEach(it=>{if(!it.done)todos.push(esc(it.t)+' <i>('+esc(e.titre)+')</i>')})});
  h+=`<h2>Tâches ouvertes</h2>${todos.length?'<ul>'+todos.map(t=>`<li>${t}</li>`).join('')+'</ul>':'<p>Aucune.</p>'}`;
  if(d.notes)h+=`<h2>Notes</h2><div>${d.notes}</div>`;
  h+=`<div class="pfoot">MOMOwork — rapport de suivi d'affaire</div></div>`;
  doPrint(h,'Rapport — '+d.nom);
}

async function editContact(c){
  const isNew=!c;c=c?{...c}:{id:uid('C-'),fav:false,nom:'',societe:'',secteur:'',tel:'',mail:'',adresse:'',siret:''};
  const F=[['societe','Société'],['nom','Nom prénom'],['tel','Téléphone'],['mail','Mail'],['adresse','Adresse'],...(CTAB==='clients'?[['secteur','Secteur d\u2019activité']]:[]),...(CTAB!=='clients'?[['siret','SIRET']]:[])];
  const body=document.createElement('div');body.innerHTML=`<div class="fgrid">${F.map(([k,l])=>`<label class="f"><span>${l}</span><input data-k="${k}" value="${esc(c[k]||'')}"></label>`).join('')}</div>`;
  const ok=await modal({title:(isNew?'Nouveau contact — ':'Modifier — ')+CT_LABEL[CTAB],body,buttons:[{l:'Annuler'},{l:'Enregistrer',v:true,cls:'pri',fn:()=>{$$('[data-k]',body).forEach(i=>c[i.dataset.k]=i.value.trim())}}]});
  if(!ok)return;const L0=IDX.carnet[CTAB];const i=L0.findIndex(x=>x.id===c.id);if(i<0)L0.push(c);else L0[i]=c;markIdx();renderDrawer();

function upsertContact(sec,c){if(!c||!(c.societe||c.contact||c.nom))return;const L0=IDX.carnet[sec];const key=x=>(x.mail||'').toLowerCase()||((x.societe||'')+'|'+(x.nom||'')).toLowerCase();
  const nc={nom:c.contact||c.nom||'',societe:c.societe||'',tel:c.tel||'',mail:c.mail||'',secteur:c.secteur||'',adresse:c.adresse||''};
  const ex=L0.find(x=>key(x)===key(nc))||(nc.societe&&L0.find(x=>x.societe&&x.societe.toLowerCase()===nc.societe.toLowerCase()&&(!x.nom||!nc.nom||x.nom===nc.nom)));
  if(ex){let ch=false;for(const f in nc)if(nc[f]&&!ex[f]){ex[f]=nc[f];ch=true}if(ch)markIdx()}else{L0.push({id:uid('C-'),fav:false,...nc});markIdx()}}

$('#btnGuide').onclick=()=>modal({title:'📖 Guide MOMOwork',wide:true,body:`<div class="guide">
<h3>Principe</h3><p>La carte n'affiche que les <b>points</b> des affaires (index léger). Le dossier complet d'une affaire — étapes, documents joints, DC, métré — n'est <b>chargé qu'au clic</b> sur son point, depuis son propre fichier .mmw.</p>
<h3>Sauvegarde 💾</h3><ul><li><b>Nouvelle sauvegarde</b> : choisissez un dossier de travail. MOMOwork y écrit <code>MOMOwork.mmw</code> (index : points, carnet, fiche entreprise) et un sous-dossier <code>affaires/</code> avec un .mmw par affaire. L'entrée se grise et passe au ✔ vert une fois active.</li><li><b>Sauvegarde auto</b> : réglable en minutes ou en heures (0 = désactivée). Le point orange sur la disquette signale des modifications en attente.</li><li><b>Sauvegarde manuelle</b> : crée un fichier complet daté <code>MOMOwork_save-manuelle_….mmw</code> à côté de la sauvegarde auto (rechargeable via « Charger un fichier .mmw »).</li><li>Au redémarrage, le navigateur peut redemander l'accès au dossier : un clic sur une affaire ou sur 🔌 Reconnecter suffit.</li><li>Sans Chrome/Edge, les données restent dans le navigateur ; utilisez Exporter / Charger pour les fichiers.</li></ul>
<h3>Carte</h3><p>Pins par état (📥 AO, 🕑 répondu, 🔍 à valider, ⚙️ étude, 🏗️ travaux, 💵 terminé, ♻️ sans suite). Le tag « Appel d'offre » cycle : tous → non répondus → à valider → répondus → masqués. Palette de gauche : fonds OSM / Esri / OpenTopoMap / IGN, surcouches cadastre / pentes / communes, cotes et aires.</p>
<h3>Rapport de suivi</h3><p>Le clic sur un point ouvre le rapport : échéance, avancement des 6 étapes (Dénomination → Étude préliminaire → Consultation des prix → Métré → Dossier administratif → Remise), documents liés, tâches, météo. Chaque onglet d'étape a son bouton « Marquer l'étape terminée ». 🖨️ produit le rapport en PDF.</p>
<h3>Métré & Mapulator</h3><p>Faites le métré dans Mapulator, enregistrez le .map, puis « Lier un projet .map » : le fichier est rangé dans l'affaire et les quantités reconnues remplissent le tableau. « Récupérer le .map » le redonne pour le rouvrir dans Mapulator.</p>
<h3>DC1 · DC2 · DC3 · DC4</h3><p>Remplissez une fois la 🏢 fiche entreprise : les formulaires de chaque affaire se pré-remplissent (acheteur, objet, identité, CA, effectifs, RIB…). Un DC4 par sous-traitant, choisi dans le carnet. Impression en PDF au format du modèle.</p>
<h3>Raccourcis</h3><p><b>Ctrl+S</b> enregistrer · <b>Échap</b> fermer / annuler l'outil.</p></div>`});

/* ============ Logo, splash, icônes ============ */
const MPATH='M8 8 L424 587 L836 8 L836 828 L700 828 L700 438 L424 824 L145 438 L145 828 L8 828 Z';
const FLOORS=[ // du bas (W) vers le haut (K) : bloc + découpes (lettres pivotées)
  {r:[886,820,376,392],rx:[0,0,16,0],cuts:[[886,945,215,7],[886,1079,215,7]]},
  {r:[886,548,376,260],rx:[40,40,40,40],cuts:[[994,676,106,7]]},
  {r:[886,280,376,260],rx:[40,0,0,0],cuts:[[1099,280,7,62],[962,406,58,7],[1099,406,163,7]]},
  {r:[886,10,376,262],rx:[0,0,0,0],cuts:[[1099,10,7,85],[886,137,129,7],[1092,137,170,7]]}];
function floorPath([x,y,w,h],[tl,tr,br,bl]){return `M${x+tl} ${y}H${x+w-tr}${tr?`Q${x+w} ${y} ${x+w} ${y+tr}`:''}V${y+h-br}${br?`Q${x+w} ${y+h} ${x+w-br} ${y+h}`:''}H${x+bl}${bl?`Q${x} ${y+h} ${x} ${y+h-bl}`:''}V${y+tl}${tl?`Q${x} ${y} ${x+tl} ${y}`:''}Z`}
function logoSVG(bg){
  const cuts=FLOORS.flatMap(f=>f.cuts).map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#000"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${bg?'-120 -120 1510 1460':'0 0 1270 1220'}" width="512" height="${bg?512:492}">${bg?'<rect x="-120" y="-120" width="1510" height="1460" rx="260" fill="#fff"/>':''}<defs><mask id="mk"><rect x="0" y="0" width="1300" height="1300" fill="#fff"/>${cuts}</mask></defs><path d="${MPATH}" fill="#808080"/><path d="${MPATH}" fill="#808080" transform="translate(0 384)"/><g mask="url(#mk)" fill="#9D00C2">${FLOORS.map(f=>`<path d="${floorPath(f.r,f.rx)}"/>`).join('')}</g></svg>`;
}
function buildSplash(){
  $('#workBlocks').innerHTML=FLOORS.map((f,i)=>`<g class="fl fl${i+1}"><path d="${floorPath(f.r,f.rx)}" fill="#9D00C2"/>${f.cuts.map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff"/>`).join('')}</g>`).join('');
}
function svgToPNG(svg,size){return new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const r=Math.min(size/img.width,size/img.height);const w=img.width*r,h=img.height*r;g.drawImage(img,(size-w)/2,(size-h)/2,w,h);res(c.toDataURL('image/png'))};img.onerror=()=>res(null);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
async function setupIcons(){
  const fav=await svgToPNG(logoSVG(false),64),i192=await svgToPNG(logoSVG(true),192),i512=await svgToPNG(logoSVG(true),512),i180=await svgToPNG(logoSVG(true),180);
  const add=(rel,href,extra={})=>{if(!href)return;const l=document.createElement('link');l.rel=rel;l.href=href;Object.assign(l,extra);document.head.append(l)};
  add('icon',fav,{type:'image/png'});add('apple-touch-icon',i180);
  const man={name:'MOMOwork',short_name:'MOMOwork',description:'Suivi et étude de chantier',start_url:location.href.split('#')[0],scope:location.href.split('#')[0].replace(/[^/]*$/,''),display:'standalone',background_color:'#ffffff',theme_color:'#ffffff',icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'}]};
  add('manifest',URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'})));
}

/* ============ Démarrage ============ */
function renderAll(){renderFbar();renderTools();refreshMarkers();renderAnnots();if(VIEW==='list')renderList();if(VIEW==='agenda')renderAgenda();if(DRAWER)renderDrawer();updSaveUI()}
async function boot(){
  buildSplash();
  const t0=Date.now();
  try{await IDB.open()}catch(e){toast('Stockage du navigateur indisponible','err')}
  if(IDB.db)await Store.init();
  try{IDX=IDB.db?await Store.loadIndex():null}catch(e){IDX=null}
  if(!IDX)IDX=newIndex();normIdx();
  try{initMap()}catch(e){console.error(e);$('#map').innerHTML='<p style="padding:20px" class="mute">Carte indisponible (pas de connexion au serveur de cartes).</p>'}
  renderAll();startAuto();setupIcons();
  if(MAP&&!IDX.settings.center)fitAll();
  setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),500);
    if(Store.mode==='folder'&&!Store.granted)toast(`Cliquez sur une affaire ou sur 💾 › Reconnecter pour rouvrir le dossier « ${Store.dir.name} »`);
    else if(!IDX.affaires.length)toast('Bienvenue ! Commencez par 💾 › Nouvelle sauvegarde, puis ＋ Nouvelle affaire.');
    MAP&&MAP.invalidateSize()},Math.max(0,2900-(Date.now()-t0)));
}
boot();
