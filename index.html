<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f2937">
<title>MOMOwork - Suivis de chantier</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#111827;--pan:#1f2937;--pan2:#374151;--card:#1f2937;--field:#374151;--line:#4b5563;--line2:#374151;--ink:#e5e7eb;--hi:#fff;--mute:#9ca3af;--grey:#8a8a8a;--acc:#9D00C2;--acc2:#c04de0;--acc-l:#3b1147;--ok:#34d399;--okbg:#064e3b;--warn:#fbbf24;--warnbg:#422006;--err:#f87171;--errbg:#450a0a;--blue:#3b82f6;--teal:#2dd4bf;--tealbg:#134e4a;--sky:#38bdf8;--skybg:#0c4a6e}
*{box-sizing:border-box;box-shadow:none!important;text-shadow:none!important}
html,body{margin:0;height:100%;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);color-scheme:dark}
a{color:#93c5fd}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--field);color:var(--hi);min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
[contenteditable]:focus{outline:none}
input[type=checkbox],input[type=radio]{accent-color:var(--acc2)}
textarea{resize:vertical;width:100%}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--pan)}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.mute{color:var(--mute)} .sp{flex:1} .num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;align-items:center}
.btn{height:30px;border:1px solid var(--line);background:var(--pan2);border-radius:6px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--line)} .btn.pri{background:var(--acc);border-color:var(--acc2);color:#fff} .btn.pri:hover{background:var(--acc2)}
.btn.danger{color:var(--err);border-color:#7f1d1d} .btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.x{border:0;background:transparent;cursor:pointer;color:var(--mute);padding:2px 6px;border-radius:4px} .x:hover{background:var(--errbg);color:var(--err)}

/* Header (MomoCAD) */
header#top{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--pan2);background:var(--pan);z-index:2000}
#app-logo{margin:0 10px 0 4px;display:flex;align-items:center;user-select:none;cursor:default}
#app-logo svg{height:26px;width:auto;display:block}
.hsep{width:1px;height:20px;background:var(--line);margin:0 4px}
.hbtn{height:36px;min-width:36px;border:1px solid var(--line);background:var(--pan2);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;position:relative;color:var(--ink)}
.hbtn:hover{background:var(--line)}
.hbtn.blue{color:#60a5fa} .hbtn.green{color:#6ee7b7} .hbtn.sky{color:#93c5fd}
#diskBadge{display:none;align-items:center;justify-content:center;position:absolute;right:-5px;top:-5px;min-width:15px;height:15px;border-radius:8px;font-size:10px;line-height:15px;text-align:center;color:#fff;display:none;padding:0 3px;font-weight:700}
#diskBadge.ok{display:flex;stroke-width:3;background:#10b981} #diskBadge.dirty{display:block;background:#d97706} #diskBadge.warn{display:block;background:#dc2626}
#saveState{font-size:11px;color:var(--mute);margin-right:4px}
.menu{position:fixed;top:56px;right:8px;width:340px;background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:5px;z-index:2500;display:none}
.menu.on{display:block}
.mi{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:5px;cursor:pointer;color:var(--ink)}
.mi:hover:not(.row):not([disabled]):not(.dis){background:var(--pan2)} .mi small{flex-basis:100%;color:var(--mute);padding-left:24px;font-size:11px}
.mi.dis,.mi[disabled]{color:#6b7280;cursor:default}
.mi .chk{color:var(--ok);font-weight:900}
.mi.row{cursor:default;flex-wrap:nowrap} .mi.row input{width:64px}
.minote{font-size:11px;color:var(--mute);padding:2px 8px 6px 32px}
.menu hr{border:0;border-top:1px solid var(--pan2);margin:4px 0}

/* Layout */
#app{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex}
#tools{width:124px;flex:none;border-right:1px solid var(--pan2);background:var(--pan);overflow:auto;padding:6px 5px}
.pal{margin-bottom:7px}
.pal-h{width:100%;display:flex;align-items:center;justify-content:space-between;padding:3px 6px;margin-bottom:3px;border:0;background:transparent;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.pal-h:hover{background:var(--pan2);color:var(--ink)}
.pal-chev{transition:transform .15s}
.pal.closed .tgrid{display:none} .pal.closed .pal-chev{transform:rotate(-90deg)}
.tgrid{display:grid;grid-template-columns:repeat(3,34px);gap:4px;justify-content:center;border:1px solid var(--pan2);padding:4px;border-radius:8px;background:var(--pan)}
.tsep{grid-column:1/-1;height:1px;background:var(--line);margin:2px 3px}
.tb{width:34px;height:34px;border:1px solid var(--line);border-radius:4px;background:var(--pan2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;padding:0;line-height:1;color:var(--ink)}
.tb:hover{background:var(--line)} .tb.on{background:var(--blue);border-color:#2563eb;color:#fff}
.tb.txt{font-size:10px;font-weight:800;letter-spacing:-.2px}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#fbar{display:flex;gap:5px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--pan2);flex-wrap:wrap;background:var(--pan)}
.tag{height:26px;border:1px solid var(--line);border-radius:13px;background:var(--pan2);padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink)}
.tag .dot{width:9px;height:9px;border-radius:50%}
.tag.off{opacity:.35;text-decoration:line-through}
#search{width:210px;height:28px}
#count{font-size:12px;color:var(--mute)}
.view{flex:1;position:relative;overflow:auto;display:none} .view.on{display:block}
#v-map{overflow:hidden} #map{position:absolute;inset:0;background:#0b1220}
#modeHint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--pan);border:1px solid #a16207;color:#fde047;padding:6px 12px;border-radius:6px;z-index:800;font-size:12px;display:none}
.pin{background:none;border:0}.pin svg{display:block;overflow:visible}
.leaflet-container{font:inherit;background:#0b1220}
.leaflet-tooltip{background:var(--pan);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.leaflet-tooltip-top:before{border-top-color:var(--line)}
.mlabel{background:#1f2937!important;border:1px solid #c04de0!important;color:#f5d0fe!important;font-weight:700;font-size:12px;padding:2px 7px!important;white-space:nowrap}.mlabel:before{display:none}
.mseglab{background:rgba(17,24,39,.85)!important;border:0!important;color:#e9a8f7!important;font-size:10.5px;font-weight:600;padding:1px 5px!important}.mseglab:before{display:none}
.mlive{background:#c04de0!important;border:0!important;color:#fff!important;font-weight:700;font-size:12px;padding:3px 8px!important;white-space:nowrap}.mlive:before{display:none}
.leaflet-control-attribution{background:rgba(31,41,55,.8)!important;color:var(--mute)!important}.leaflet-control-attribution a{color:#93c5fd!important}

/* Drawer */
#drawer{position:absolute;top:0;left:0;bottom:0;width:390px;max-width:100%;background:var(--pan);border-right:1px solid var(--line);z-index:1100;display:none;flex-direction:column}
#drawer.on{display:flex}
.dh{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--pan2)}
.dh b{font-size:14px;color:var(--hi)}
.db{flex:1;overflow:auto;padding:10px 12px}
.ctabs{display:flex;gap:3px;margin-bottom:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px}
.ctabs button{flex:1;border:0;background:transparent;border-radius:6px;padding:5px;cursor:pointer;font-size:12px;color:#d1d5db;font-weight:600}
.ctabs button.on{background:var(--blue);color:#fff}
.contact{border:1px solid var(--pan2);background:var(--bg);border-radius:6px;padding:7px 9px;margin-bottom:6px;display:flex;gap:8px}
.contact .ci{flex:1;min-width:0} .contact .ci div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{border:0;background:none;cursor:pointer;font-size:16px;padding:0}
.lien{display:block;color:#fff;text-decoration:none;font-weight:700;padding:11px 14px;border-radius:6px;margin-bottom:6px}
.lien:hover{filter:brightness(1.15)}

/* Lists */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:6px;border-bottom:1px solid var(--line);font-weight:700;background:var(--bg)}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--pan2);vertical-align:middle}
.tbl td input,.tbl td select{width:100%;padding:4px 6px}
.tbl input.w4{width:56px} .tbl input.w6{width:76px} .tbl input.w7{width:92px}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--pan2)}
.tbl .empty{text-align:center;color:var(--mute);padding:14px}
.tbl tr.st-retenu td{background:rgba(16,185,129,.12)} .tbl tr.st-ecarte td{opacity:.45}
.listwrap{padding:12px}
.listwrap .tbl{background:var(--pan);border:1px solid var(--pan2)}
.bar{height:6px;background:var(--pan2);border-radius:3px;overflow:hidden;width:90px} .bar i{display:block;height:100%;background:var(--acc2)}
.jb{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;border:1px solid var(--line)}
.jb.late{background:var(--errbg);color:var(--err);border-color:#7f1d1d} .jb.soon{background:var(--warnbg);color:var(--warn);border-color:#78350f} .jb.ok{background:var(--okbg);color:var(--ok);border-color:#065f46} .jb.done{background:var(--skybg);color:var(--sky);border-color:#075985} .jb.av{background:var(--tealbg);color:var(--teal);border-color:#115e59}
.agenda{max-width:820px;margin:0 auto;padding:16px}
.agenda h2{color:var(--hi)}
.agi{display:flex;align-items:center;gap:10px;border:1px solid var(--pan2);border-radius:6px;padding:9px 12px;margin-bottom:6px;cursor:pointer;background:var(--pan)}
.agi:hover{background:var(--pan2)} .agi.late{border-color:#7f1d1d;background:#2a1215}
.agline{display:flex;align-items:center;gap:8px;margin:14px 0;color:#e9a8f7;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.agline:before,.agline:after{content:"";flex:1;height:2px;background:var(--acc2)}

/* Rapport */
#rapport{position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--bg);z-index:1500;display:none;flex-direction:column}
#rapport.on{display:flex}
#rhead{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--pan2);flex-wrap:wrap;background:var(--pan)}
.rpin{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.rtitle{font-size:17px;font-weight:700;border-color:transparent;background:transparent;width:340px;max-width:100%}
.rtitle:hover{border-color:var(--line)}
.lbl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute)}
.pill{width:36px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:15px;background:var(--pan2);cursor:pointer;filter:grayscale(1);opacity:.5}
.pill.on-av{filter:none;opacity:1;background:var(--tealbg);border-color:var(--teal)}
.pill.on-rep{filter:none;opacity:1;background:var(--okbg);border-color:var(--ok)}
.rbody{flex:1;display:flex;min-height:0}
#rnav{width:200px;flex:none;border-right:1px solid var(--pan2);background:var(--pan);padding:8px;overflow:auto}
.rn{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;margin-bottom:2px;color:var(--mute);font-weight:500}
.rn:hover{background:var(--pan2);color:var(--ink)} .rn.on{background:var(--blue);color:#fff}
.rn .sd{margin-left:auto;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.sd.prog{background:var(--warn);border-color:var(--warn)} .sd.done{background:var(--ok);border-color:var(--ok)}
#rcontent{flex:1;overflow:auto;padding:14px 18px 40px;min-width:0}
#rcontent.full{padding:0;overflow:hidden;display:flex;flex-direction:column}
.tabhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tabhead>div:first-child{flex:1;min-width:240px}
.tabhead h2{margin:0;font-size:19px;color:var(--hi)} .tabhead p{margin:3px 0 0}
.stepbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--pan2);border-radius:16px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.stepbtn.done{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.card{border:1px solid var(--pan2);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:var(--pan)}
.cardh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cardh b{font-size:13.5px;color:var(--hi)}
.cattitle{font-weight:700;font-size:14px;border-color:transparent;background:transparent;width:260px} .cattitle:hover{border-color:var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.c2{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:3px}
.f>span{font-size:11px;color:var(--mute);font-weight:600}
.f .row input{flex:1}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:2px}
.radios{display:flex;flex-wrap:wrap;gap:6px 16px}
.radios label{display:flex;gap:5px;align-items:center;cursor:pointer}
.typo{display:flex;gap:8px;flex-wrap:wrap}
.typo label{border:1px solid var(--line);background:var(--pan2);border-radius:6px;padding:8px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.typo label:has(input:checked){border-color:var(--acc2);background:var(--acc-l)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;border-radius:6px;color:#d1d5db;font-weight:600}
.seg button:hover{background:var(--pan2)}
.seg button.on.oui{background:#059669;color:#fff} .seg button.on.non{background:var(--line);color:#fff} .seg button.on.nc{background:#b45309;color:#fff}
.totbar{text-align:right;font-size:14px;margin:6px 0 0} .totbar b{color:#e9a8f7;font-size:16px}
.rte{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--field)}
.rtebar{display:flex;gap:2px;padding:3px;border-bottom:1px solid var(--line);background:var(--pan)}
.rtebar button{border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 8px;cursor:pointer;color:var(--ink)}
.rtebar button:hover{background:var(--pan2);border-color:var(--line)}
.rted{min-height:90px;padding:8px 10px;outline:none;color:var(--hi)} .rted.big{min-height:320px}
.rted:empty:before{content:attr(data-ph);color:#6b7280}
/* Synthèse */
.pipe{display:flex;align-items:stretch;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.stp{flex:1;min-width:120px;border:1px solid var(--pan2);border-radius:8px;background:var(--pan);padding:9px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.stp:hover{border-color:var(--line)}
.stp .si{font-size:18px} .stp small{color:var(--mute)}
.stp.done{border-color:#059669;background:rgba(16,185,129,.1)} .stp.done small{color:var(--ok);font-weight:700}
.stp.prog{border-color:#b45309;background:rgba(245,158,11,.08)} .stp.prog small{color:var(--warn);font-weight:700}
.arr{align-self:center;color:var(--line);font-size:18px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sgrid .card{margin:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--pan2)} .kv span{color:var(--mute)} .kv b{color:var(--hi);font-weight:600;text-align:right}
.big-ech{font-size:22px;font-weight:800;color:var(--hi)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:2px 9px;font-size:12px;display:inline-flex;gap:5px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.wxweek{display:flex;gap:6px;align-items:stretch;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.wxnow{display:flex;align-items:center;gap:10px;border:1px solid var(--pan2);background:var(--pan);border-radius:8px;padding:8px 12px;flex:none}
.wxnow>div{display:flex;flex-direction:column;line-height:1.2}.wxnow b{font-size:20px;color:var(--hi)}.wxnow span{font-size:12px;color:var(--ink)}.wxnow small{font-size:11px;color:var(--mute)}
.wxday{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--pan2);background:var(--pan);border-radius:8px;padding:7px 6px}
.wxday small{font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}.wxday small.wet{color:#7dd3fc}
.wxday b{font-size:15px;color:var(--hi)}.wxday b span{color:var(--mute);font-weight:500;font-size:12px;margin-left:4px}
.wxday.today{border-color:#2563eb}.wxday.ech{border-color:#c04de0;background:var(--acc-l)}
.ttwx{display:flex;align-items:center;gap:6px;margin:4px 0 2px}.ttwx b{font-size:14px;color:#fff}.ttwx span{font-size:11.5px;color:#cbd5e1}
.met{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--pan2);background:var(--bg);border-radius:6px;padding:5px 8px;margin:0 4px 4px 0;min-width:72px}
.met span{font-size:20px}
.dclist .kv b{color:#e9a8f7}
/* Documents */
#drop{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--mute);margin-top:10px}
#drop.over{border-color:var(--acc2);background:var(--acc-l);color:#e9a8f7}
.fname{font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
/* Chrono */
.tl{position:relative;display:flex;gap:26px;overflow-x:auto;padding:10px 10px 6px;min-height:150px;align-items:center}
.tlline{position:absolute;left:0;right:0;top:50%;height:3px;background:var(--line)}
.tln{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;width:96px;color:var(--ink)}
.tli{width:42px;height:42px;border-radius:50%;background:var(--pan2);border:2px solid var(--acc2);color:#e9a8f7;display:flex;align-items:center;justify-content:center;font-size:19px}
.tln:hover .tli{background:var(--acc-l)}
.tln.plus .tli{background:var(--acc);color:#fff;font-size:22px;width:50px;height:50px}
.tlt{font-size:11.5px;font-weight:600;text-align:center;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:16px}
.tld{font-size:11px;color:var(--mute)}
.todo{display:flex;gap:6px;align-items:center;margin-bottom:4px} .todo .tt{flex:1}
.todo.done .tt,.todo.done span{text-decoration:line-through;color:var(--mute)}
/* Admin */
.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;border-bottom:1px solid var(--pan2);padding-bottom:8px}
.subt{border:1px solid var(--line);background:var(--pan2);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink);font-weight:600}
.subt small{color:var(--mute);margin-left:4px;font-weight:400}
.subt.on{border-color:#2563eb;background:var(--blue);color:#fff} .subt.on small{color:#dbeafe}
.subt.add{border-style:dashed;background:transparent}
.dcsec{border:1px solid var(--pan2);border-radius:8px;margin-bottom:10px;overflow:hidden;background:var(--pan)}
.dcst{background:var(--bg);padding:7px 10px;font-weight:700;border-bottom:1px solid var(--pan2);color:var(--hi)}
.dcst span{display:inline-block;background:var(--acc);color:#fff;border-radius:4px;padding:0 7px;margin-right:6px}
.dcsec .fgrid{padding:10px}
.calc{padding:6px 8px;background:var(--bg);border:1px solid var(--pan2);border-radius:6px;font-weight:700;color:#e9a8f7}
.note{font-size:12px;color:var(--mute);font-style:italic}
.warncard{border-color:#78350f!important;background:#1c1406!important;color:#fcd34d}
/* Métré / Mapulator intégré */
.mbar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--pan2);background:var(--pan);flex-wrap:wrap}
.mbar h2{margin:0 8px 0 0;font-size:16px;color:var(--hi)}
.mseg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.mseg button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:5px 12px;border-radius:6px;color:#d1d5db;font-weight:600;cursor:pointer}
.mseg button:hover{background:var(--pan2)} .mseg button.on{background:#d97706;color:#000}
#mapuState{font-size:12px;color:var(--mute)} #mapuState.ok{color:var(--ok)} #mapuState.busy{color:var(--warn)}
.mbody{flex:1;position:relative;min-height:0}
#mapuFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#080808}
#mapuLoad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);background:#080808;flex-direction:column;gap:8px}
.mpostes{position:absolute;inset:0;overflow:auto;padding:14px 18px 30px}
.srcb{font-size:11px;padding:1px 6px;border-radius:8px;border:1px solid var(--line)} .srcb.map{color:#fbbf24;border-color:#78350f;background:#1c1406}

/* Modal */
.mw-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:flex;align-items:center;justify-content:center;padding:14px}
.mw-modal .box{background:var(--pan);border:1px solid var(--line);border-radius:10px;width:480px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;color:var(--ink)}
.mw-modal .box.wide{width:820px}
.mh{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--pan2)} .mh b{flex:1;font-size:15px;color:var(--hi);display:flex;align-items:center;gap:8px}
.ico{flex:none;display:inline-block;vertical-align:-.18em}
.btn .ico,.mi .ico,.hbtn .ico{vertical-align:middle}
.mi>.ico{color:#93c5fd}
.cardh b{display:inline-flex;align-items:center;gap:7px}.cardh b .ico{color:#93c5fd}
.tag .ico{opacity:.9}
.dh b{display:flex;align-items:center;gap:8px}
.tb .ico{width:18px;height:18px}
.c-blue{color:#93c5fd}.c-green{color:#6ee7b7}.c-amber{color:#fcd34d}.c-pink{color:#f9a8d4}.c-purple{color:#d8b4fe}.c-sky{color:#7dd3fc}.c-lime{color:#bef264}.c-orange{color:#fdba74}.c-red{color:#fca5a5}
.stp .si{color:#93c5fd}.stp.done .si{color:var(--ok)}.stp.prog .si{color:var(--warn)}
.rn .ico{opacity:.9}
.star{color:#fbbf24}
.met span{color:#93c5fd}
.mb{padding:14px;overflow:auto} .mb p{margin:0 0 8px}
.mf{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--pan2)}
.guide h3{margin:16px 0 6px;color:#93c5fd;font-size:13px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--pan2);padding-bottom:4px} .guide p,.guide li{color:#d1d5db;line-height:1.5}
.guide code{background:var(--bg);padding:1px 5px;border-radius:4px;color:#e9a8f7}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:4000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--pan2);border:1px solid var(--line);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px}
.toast.err{background:#7f1d1d;border-color:#b91c1c} .toast.ok{background:#065f46;border-color:#059669}

/* Splash (fond blanc, comme MomoCAD) */
#splash{position:fixed;inset:0;background:#fff;z-index:5000;display:flex;align-items:center;justify-content:center;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(300px,55vw);overflow:visible}
#splash .m1{animation:mTop .9s cubic-bezier(.2,.8,.2,1) both}
#splash .m2{animation:mBot .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes mTop{from{transform:translateY(-700px);opacity:0}to{transform:none;opacity:1}}
@keyframes mBot{from{transform:translateY(700px);opacity:0}to{transform:none;opacity:1}}
#splash .fl{opacity:0}
#splash #crane{opacity:0}
#splash .cable{transform-box:fill-box;transform-origin:50% 0}
@media (prefers-reduced-motion:reduce){#splash{display:none}}

#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;font-size:11px}
}
.pdoc{color:#000;background:#fff}
.pdoc h1{font-size:17px;margin:0} .pdoc h2{font-size:13px;margin:14px 0 5px;color:#9D00C2;border-bottom:1.5px solid #9D00C2;padding-bottom:2px}
.pdoc table{width:100%;border-collapse:collapse;margin:4px 0} .pdoc td,.pdoc th{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top} .pdoc th{background:#f1f1f1}
.pdoc .phead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.pdoc .phead svg{height:22px;width:auto;display:block;margin-bottom:4px}
.pdoc .dch{display:flex;gap:12px;align-items:center;border:2px solid #000;padding:8px;margin-bottom:10px}
.pdoc .dcbadge{font-size:26px;font-weight:900;border-right:2px solid #000;padding-right:12px}
.pdoc .dcsup{font-size:10px;letter-spacing:2px}
.pdoc .dcsec{border:1px solid #000;border-radius:0;margin-bottom:8px;page-break-inside:avoid;background:#fff}
.pdoc .dcst{background:#e9e9e9;border-bottom:1px solid #000;padding:4px 8px;color:#000}
.pdoc .dcst span{background:#000}
.pdoc .pf{padding:4px 8px} .pdoc .pf .pl{font-size:10px;color:#444} .pdoc .pf .pv{white-space:pre-wrap;min-height:14px;border-bottom:1px dotted #999;padding:1px 0}
.pdoc .pfoot{margin-top:14px;font-size:9px;color:#666;text-align:center}
@media (max-width:760px){#rnav{width:56px}.rn span.t{display:none}.fgrid{grid-template-columns:1fr}#saveState{display:none}#app-logo svg{height:18px}}
</style>
</head>

<script>
'use strict';
/* ============ Utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowLocal=()=>{const d=new Date();return `${todayISO()}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtD=iso=>{if(!iso)return '—';const d=new Date(iso.length<=10?iso+'T00:00':iso);if(isNaN(d))return iso;let s=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});if(iso.length>10)s+=' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});return s};
const daysTo=iso=>{if(!iso)return null;const d=new Date(iso.slice(0,10)+'T00:00');const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)};
const num=v=>{const n=parseFloat(String(v??'').replace(/\s|\u202f|€/g,'').replace(',','.'));return isNaN(n)?0:n};
const eur=n=>(+n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const qfmt=n=>(+n||0).toLocaleString('fr-FR',{maximumFractionDigits:2});
const stamp=()=>{const d=new Date();return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}_${pad(d.getHours())}.${pad(d.getMinutes())}.${pad(d.getSeconds())}`};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const setPath=(o,p,v)=>{const ks=p.split('.');let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null)c[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};c=c[ks[i]]}c[ks[ks.length-1]]=v};
const getPath=(o,p)=>p.split('.').reduce((c,k)=>c==null?c:c[k],o);
const opts=(map,cur)=>Object.entries(map).map(([k,v])=>`<option value="${esc(k)}" ${k===cur?'selected':''}>${esc(Array.isArray(v)?v[0]:v)}</option>`).join('');
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;$('#toast').append(t);setTimeout(()=>t.remove(),type==='err'?5000:2800)}
function download(name,text,mime='application/json'){const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function pickFile(accept,multiple=false){return new Promise(res=>{const i=$('#fileIn');i.value='';i.accept=accept;i.multiple=multiple;i.onchange=()=>res([...i.files]);i.click()})}
const readText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)});
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});

function modal({title,body,buttons=[{l:'Fermer'}],wide,onOpen}){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='mw-modal';
    m.innerHTML=`<div class="box ${wide?'wide':''}"><div class="mh"><b>${title}</b><button class="x">${ic('x',16)}</button></div><div class="mb"></div><div class="mf"></div></div>`;
    const mb=$('.mb',m); if(typeof body==='string')mb.innerHTML=body; else mb.append(body);
    const close=v=>{m.remove();res(v)};
    buttons.forEach(b=>{const bt=document.createElement('button');bt.className='btn '+(b.cls||'');bt.innerHTML=(b.ic?ic(b.ic,15):'')+esc(b.l);bt.onclick=async()=>{if(b.fn){const r=await b.fn(m);if(r===false)return}close(b.v)};$('.mf',m).append(bt)});
    $('.x',m).onclick=()=>close(undefined);
    m._close=close;
    document.body.append(m); onOpen&&onOpen(m);
  });
}

const MTF_ETAT={"Appel d'offre":'ao','Location':'location','En étude':'etude','En travaux':'travaux','Terminé':'termine','Sans suite':'sanssuite'};
function isMTF(o){return o&&(o.app==='MOMOtion Flow'||Array.isArray(o)||(Array.isArray(o.affaires)&&!o.app&&(o.affaires.length===0||o.affaires[0].adresse!==undefined||o.affaires[0].events!==undefined)))}
const mtfDate=ts=>{if(!ts)return nowLocal();const d=new Date(ts);if(isNaN(d))return nowLocal();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
function mtfTable(t){if(!t||!Array.isArray(t.cols))return '';return `<table border="1" style="border-collapse:collapse"><tr>${t.cols.map(c=>`<th style="padding:3px 6px">${esc(c)}</th>`).join('')}</tr>${(t.rows||[]).map(r=>`<tr>${r.map(c=>`<td style="padding:3px 6px">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`}
function mtfApply(a,x){
  const d=a.deno,ad=x.adresse||{},cl=x.client||{};
  d.nom=x.nom||d.nom;d.etat=MTF_ETAT[x.etat]||d.etat||'ao';
  d.echeance=x.echeance?(String(x.echeance).length===10?x.echeance+'T12:00':String(x.echeance).slice(0,16)):'';
  d.repondu=!!x.repondu;d.avalider=!!x.avalider;
  d.adresse=(typeof ad==='string'?ad:ad.text)||d.adresse;if(ad.lat!=null&&ad.lng!=null){d.lat=+ad.lat;d.lng=+ad.lng}
  d.client.societe=cl.entreprise||cl.societe||d.client.societe;d.client.contact=cl.contact||d.client.contact;d.client.tel=cl.tel||d.client.tel;d.client.mail=cl.mail||d.client.mail;
  const seen=new Set(a.events.map(e=>e.mtf).filter(Boolean)),seenF=new Set(a.docs.map(x=>x.mtf).filter(Boolean));
  (x.events||[]).forEach(ev=>{
    if(ev.type==='file'){(ev.files||[]).forEach(fl=>{const k=ev.id+'/'+fl.id;if(seenF.has(k))return;a.docs.push({id:uid('D-'),mtf:k,cat:guessCat(fl.name||''),nom:(ev.title?ev.title+' — ':'')+String(fl.name||'fichier').replace(/\.[^.]+$/,''),st:'recu',pour:'',recu:mtfDate(ev.ts).slice(0,10),note:'Importé de MOMOtion Flow',file:fl.data?{name:fl.name,mime:fl.mime||'application/octet-stream',size:fl.size||0,data:fl.data}:null})});return}
    if(seen.has(ev.id))return;
    const e={id:uid('E-'),mtf:ev.id,date:mtfDate(ev.ts),titre:ev.title||'',items:[],html:''};
    if(ev.type==='doc'){e.type='doc';e.html=ev.text||'';e.titre=e.titre||'Document'}
    else if(ev.type==='table'){e.type='doc';e.html=mtfTable(ev.table);e.titre=e.titre||'Tableur'}
    else{e.type='todo';e.items=(ev.notes||[]).map(n=>({t:n.text||'',done:!!n.done}));e.titre=e.titre||'To-Do'}
    a.events.push(e)});
}
async function importMTF(o,fname){

  const byMtf=new Map(IDX.affaires.filter(s=>s.mtf).map(s=>[s.mtf,s.id]));

  (C.sous_traitants||[]).forEach(c=>upsertContact('st',{contact:c.nom,societe:c.societe,tel:c.tel,mail:c.mail}));

let MAP,MARKERS,ANNOT,TEMP,BASES={},OVERS={},curBase='plan';const OVERON={};

function initMap(){

function pinStyle(s){if(s.avalider)return {c:'#F4C20D',e:'search'};if(s.etat==='ao'&&s.repondu)return {c:'#38BDF8',e:'clock'};return ETATS[s.etat]||ETATS.ao}

  return L.divIcon({className:'pin',iconSize:[36,46],iconAnchor:[18,45],tooltipAnchor:[0,-40],html:`<svg width="36" height="46" viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg"><path d="M18 44.6S33.6 29.4 33.6 17.6A15.6 15.6 0 0 0 2.4 17.6C2.4 29.4 18 44.6 18 44.6Z" fill="${st.c}" stroke="#0b1220" stroke-opacity=".6" stroke-width="1.6" stroke-linejoin="round"/><circle cx="18" cy="17.6" r="11.2" fill="#fff"/><svg x="10.2" y="9.8" width="15.6" height="15.6" viewBox="0 0 24 24" fill="none" stroke="${icol}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${IC[st.e]||''}</svg></svg>`})}
function visible(s){

function fitAll(){if(!MAP)return;const pts=IDX.affaires.filter(s=>s.lat!=null).map(s=>[s.lat,s.lng]);if(pts.length>1)MAP.fitBounds(pts,{padding:[50,50],maxZoom:15});else if(pts.length===1)MAP.setView(pts[0],14)}
/* Modes : placer, déplacer, mesures */
let DRAW=null;
function setMode(m){MODE=m;DRAW=null;LASTCLK=null;TEMP&&TEMP.clearLayers();const H={place:'Cliquez sur la carte pour placer la nouvelle affaire — Échap pour annuler',move:'Cliquez sur la carte pour positionner l\u2019affaire — Échap pour annuler',dist:'Cote : cliquez les points — double-clic, clic droit ou Entrée pour terminer',area:'Aire : cliquez les sommets — double-clic, clic droit ou Entrée pour terminer',erase:'Gomme : cliquez sur une mesure pour l\u2019effacer'};const h=$('#modeHint');h.textContent=H[m]||'';h.style.display=m?'block':'none';if(MAP){if(m==='dist'||m==='area')MAP.doubleClickZoom.disable();else MAP.doubleClickZoom.enable();$('#map').style.cursor=m?'crosshair':''}renderTools()}
let LASTCLK=null;
async function mapClick(e){
  const ll=e.latlng;
  if(MODE==='place'){setMode(null);newAffaireDialog({lat:ll.lat,lng:ll.lng});return}
  if(MODE==='move'&&MOVEA){const a=MOVEA;MOVEA=null;setMode(null);a.deno.lat=ll.lat;a.deno.lng=ll.lng;A=a;touch();if(!a.deno.adresse){const r=await revGeo(ll.lat,ll.lng);if(r){a.deno.adresse=r;touch()}}RTAB='deno';showRapport();toast('Position mise à jour','ok');return}
  if(MODE==='dist'||MODE==='area'){
    const now=Date.now(),cp=e.containerPoint;
    if(DRAW&&LASTCLK&&now-LASTCLK.t<450&&cp.distanceTo(LASTCLK.p)<10){LASTCLK=null;return finishDraw()}

    if(!DRAW)DRAW={type:MODE,pts:[]};const p=[ll.lat,ll.lng],last=DRAW.pts[DRAW.pts.length-1];if(!last||MAP.distance(last,p)>0.01)DRAW.pts.push(p);drawTemp(ll)}
}
function mapDbl(){if(DRAW)finishDraw()}
function finishDraw(){
  if(!DRAW)return;const n=DRAW.pts.length;
  if((DRAW.type==='dist'&&n>=2)||(DRAW.type==='area'&&n>=3)){IDX.annots.push({id:uid('M-'),type:DRAW.type,pts:DRAW.pts});markIdx();renderAnnots();toast(measLabel(DRAW.type,DRAW.pts),'ok')}
  else toast(DRAW.type==='area'?'Il faut au moins 3 sommets pour une aire':'Il faut au moins 2 points pour une cote','err');
  DRAW=null;TEMP.clearLayers();
}
function measLabel(type,pts){return type==='area'?`${Math.round(geoArea(pts)).toLocaleString('fr-FR')} m² · périmètre ${fmtLen(lenOf(pts,true))}`:fmtLen(lenOf(pts))}
function drawTemp(cur){
  TEMP.clearLayers();if(!DRAW||!DRAW.pts.length)return;
  const pts=cur?[...DRAW.pts,[cur.lat,cur.lng]]:DRAW.pts,s={color:'#c04de0',weight:2.5,dashArray:'6 5',interactive:false,fillOpacity:.12};
  if(DRAW.type==='area'&&pts.length>2)L.polygon(pts,s).addTo(TEMP);else L.polyline(pts,s).addTo(TEMP);
  DRAW.pts.forEach(p=>L.circleMarker(p,{radius:4,color:'#fff',weight:2,fillColor:'#c04de0',fillOpacity:1,interactive:false}).addTo(TEMP));
  if(pts.length>=2){const last=pts[pts.length-1],seg=MAP.distance(pts[pts.length-2],last);
    const txt=DRAW.type==='area'&&pts.length>2?measLabel('area',pts):fmtLen(lenOf(pts))+(pts.length>2?` (segment ${fmtLen(seg)})`:'');
    L.tooltip({permanent:true,direction:'right',offset:[14,0],className:'mlive',interactive:false}).setLatLng(last).setContent(txt).addTo(TEMP)}
}
const toRad=x=>x*Math.PI/180;
function geoArea(pts){const R=6378137;let a=0;for(let i=0;i<pts.length;i++){const p1=pts[i],p2=pts[(i+1)%pts.length];a+=toRad(p2[1]-p1[1])*(2+Math.sin(toRad(p1[0]))+Math.sin(toRad(p2[0])))}return Math.abs(a*R*R/2)}
const lenOf=(pts,close)=>{let d=0;for(let i=1;i<pts.length;i++)d+=MAP.distance(pts[i-1],pts[i]);if(close&&pts.length>2)d+=MAP.distance(pts[pts.length-1],pts[0]);return d};
const fmtLen=m=>m<1000?qfmt(m)+' m':(m/1000).toLocaleString('fr-FR',{maximumFractionDigits:3})+' km';
function renderAnnots(){if(!ANNOT)return;ANNOT.clearLayers();IDX.annots.forEach(a=>{
  const st={color:'#c04de0',weight:3,fillOpacity:.14};const l=a.type==='area'?L.polygon(a.pts,st):L.polyline(a.pts,st);
  const er=ev=>{if(MODE==='erase'){L.DomEvent.stop(ev);IDX.annots=IDX.annots.filter(x=>x.id!==a.id);markIdx();renderAnnots()}};
  l.on('click',er);ANNOT.addLayer(l);
  a.pts.forEach(p=>ANNOT.addLayer(L.circleMarker(p,{radius:3,color:'#c04de0',weight:2,fillColor:'#fff',fillOpacity:1,interactive:false})));
  const segs=a.type==='area'?a.pts.map((p,i)=>[p,a.pts[(i+1)%a.pts.length]]):a.pts.slice(1).map((p,i)=>[a.pts[i],p]);
  if(segs.length>1)segs.forEach(([p1,p2])=>ANNOT.addLayer(L.tooltip({permanent:true,direction:'center',className:'mseglab',interactive:false}).setLatLng([(p1[0]+p2[0])/2,(p1[1]+p2[1])/2]).setContent(fmtLen(MAP.distance(p1,p2)))));
  const at=a.type==='area'?l.getBounds().getCenter():L.latLng(a.pts[a.pts.length-1]);
  const lab=L.tooltip({permanent:true,direction:a.type==='area'?'center':'right',offset:a.type==='area'?[0,0]:[10,0],className:'mlabel',interactive:true}).setLatLng(at).setContent((a.type==='area'?'Aire ':'Cote ')+measLabel(a.type,a.pts));
  ANNOT.addLayer(lab);lab.getElement&&lab.getElement()&&lab.getElement().addEventListener('click',e=>{if(MODE==='erase'){e.stopPropagation();IDX.annots=IDX.annots.filter(x=>x.id!==a.id);markIdx();renderAnnots()}});
})}
async function geocode(q){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&q='+encodeURIComponent(q));const j=await r.json();return j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null}catch(e){return null}}

/* ============ Ouverture / rapport d'affaire ============ */
async function openAffaire(id,tab='rapport'){
  let a=CACHE.get(id);
  if(!a){
    if(Store.mode==='folder'&&!Store.granted&&!await Store.ensure())return;
    try{a=await Store.loadAff(id)}catch(e){console.error(e)}
    if(!a){toast('Fichier de l\u2019affaire introuvable dans la sauvegarde','err');return}
    normAff(a);CACHE.set(id,a);
  }
  A=a;RTAB=tab;showRapport();
}

/* ============ Météo (Open-Meteo, sans clé) ============ */
const WX=c=>c===0?['sun','Ensoleillé','#fbbf24']:c<=2?['sunCloud','Éclaircies','#fcd34d']:c===3?['cloud','Couvert','#cbd5e1']:c<=48?['fog','Brouillard','#94a3b8']:c<=57?['rain','Bruine','#7dd3fc']:c<=67?['rain','Pluie','#38bdf8']:c<=77?['snow','Neige','#e0f2fe']:c<=82?['rain','Averses','#38bdf8']:c<=86?['snow','Averses de neige','#e0f2fe']:['storm','Orage','#c084fc'];
const wxIcon=(c,s=20)=>{const w=WX(c);return `<span style="color:${w[2]};display:inline-flex" title="${w[1]}">${ic(w[0],s)}</span>`};
const WXC=new Map();
async function wxFetch(lat,lng,kind){
  const k=kind+'|'+(+lat).toFixed(3)+'|'+(+lng).toFixed(3),c=WXC.get(k);if(c&&(Date.now()-c.t<15*60e3))return c.v;
  const q=kind==='now'?'current=temperature_2m,weather_code,wind_speed_10m,precipitation':'daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&current=temperature_2m,weather_code,wind_speed_10m&forecast_days=7';
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&${q}&timezone=auto&wind_speed_unit=kmh`);if(!r.ok)throw new Error('météo');
  const v=await r.json();WXC.set(k,{t:Date.now(),v});return v;
}
function wxNow(s){if(s.lat==null)return Promise.resolve();return wxFetch(s.lat,s.lng,'now').then(v=>{s._wx=v.current},()=>{s._wx='err'})}
function wxNowHTML(s){const w=s._wx;if(!w)return '<span class="ttwx mute">Météo…</span>';if(w==='err')return '';
  return `<span class="ttwx">${wxIcon(w.weather_code,22)}<b>${Math.round(w.temperature_2m)}°C</b><span>${WX(w.weather_code)[1]} · vent ${Math.round(w.wind_speed_10m)} km/h</span></span>`}
async function loadMeteo(a){const el=$('#wxweek');if(!el)return;const d=a.deno;if(d.lat==null){el.innerHTML='<span class="mute">Météo : position du chantier non définie.</span>';return}
  try{const v=await wxFetch(d.lat,d.lng,'week');const D=v.daily,C=v.current,box=$('#wxweek');if(!box)return;
    const today=todayISO(),ech=(d.echeance||'').slice(0,10);
    box.innerHTML=`<div class="wxnow">${wxIcon(C.weather_code,34)}<div><b>${Math.round(C.temperature_2m)}°C</b><span>${WX(C.weather_code)[1]}</span><small>vent ${Math.round(C.wind_speed_10m)} km/h</small></div><small class="mute">Maintenant<br>sur le chantier</small></div>`+
    D.time.map((t,i)=>`<div class="wxday ${t===today?'today':''} ${t===ech?'ech':''}" title="${WX(D.weather_code[i])[1]}${t===ech?' — jour de l’échéance':''}"><small>${t===today?'Auj.':new Date(t+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</small>${wxIcon(D.weather_code[i],26)}<b>${Math.round(D.temperature_2m_max[i])}°<span>${Math.round(D.temperature_2m_min[i])}°</span></b><small class="${D.precipitation_sum[i]>=5?'wet':''}">${ic('rain',11)} ${D.precipitation_sum[i]} mm${D.precipitation_probability_max?.[i]!=null?' · '+D.precipitation_probability_max[i]+'%':''}</small><small>${ic('wind',11)} ${Math.round(D.wind_speed_10m_max[i])} km/h</small></div>`).join('')}
  catch(e){const b=$('#wxweek');if(b)b.innerHTML='<span class="mute">Météo indisponible (pas de connexion).</span>'}}

function applyMapuProject(a,json,qty){

  const rows=(qty||[]).map(q=>{const o=old.get(q.k)||old.get(q.des+'|'+q.u);return {k:q.k,des:q.des,u:q.u,q:q.q,ty:q.ty,pu:o?o.pu:'',src:'map'}});
  const sig=r=>[r.k,r.des,r.u,r.q,r.pu].join('|');

    const add=()=>{const v=$('#ev-new',body).value.trim();if(!v)return;e.items.push({t:v,done:false});touch();draw();$('#ev-new',body).focus()};
    if(e.type==='todo'){$('#ev-add',body).onclick=add;$('#ev-new',body).onkeydown=k=>{if(k.key==='Enter')add()}}};
  body.addEventListener('input',k=>{const t=k.target;if(t.id==='ev-t')e.titre=t.value;else if(t.id==='ev-html')e.html=t.innerHTML;else if(t.classList.contains('tt'))e.items[+t.dataset.i].t=t.value;else return;touch()});
  body.addEventListener('change',k=>{const t=k.target;if(t.type==='checkbox'){e.items[+t.dataset.i].done=t.checked;touch();draw()}});
  body.addEventListener('click',k=>{const d=k.target.closest('[data-del]');if(d){e.items.splice(+d.dataset.del,1);touch();draw()}});
  draw();
  const r=await modal({title:e.type==='todo'?ic('todo',18)+' To-Do':ic('file',18)+' Document',body,wide:e.type!=='todo',buttons:[{l:'Supprimer',ic:'trash',v:'del',cls:'danger'},{l:'Imprimer',ic:'print',v:'print'},{l:'Fermer',cls:'pri'}]});
  if(r==='del'&&await appConfirm('Supprimer cet événement ?','Supprimer')){A.events=A.events.filter(x=>x.id!==e.id);touch()}
  if(r==='print')doPrint(`<div class="pdoc">${pHead(e.titre)}<p>${fmtD(e.date)}</p>${e.type==='todo'?`<table>${e.items.map(i=>`<tr><td style="width:24px">${i.done?'☒':'☐'}</td><td>${esc(i.t)}</td></tr>`).join('')}</table>`:e.html}</div>`,e.titre);
  if(A){renderRTab();renderRNav()}
}

/* --- Onglet Administratif DC1–DC4 --- */
function dcCtx(){const [kind,i]=DCTAB.split(':');return {kind,i:i==null?null:+i}}
function dcVals(kind,i){if(kind==='dc4')return A.dc.dc4[i];return A.dc[kind]||(A.dc[kind]={})}
function prefillDC(kind,i,force){const v=dcVals(kind,i),ctx=kind==='dc4'?v._st:null;let n=0;DCS[kind].f.forEach(f=>{if(f[0]==='S'||!f[3]||f[2]==='calc')return;if(force||!dcFilled(v[f[0]])){const p=pre(f[3],A,ctx);if(p!==undefined&&p!==''&&p!==null){v[f[0]]=p;n++}}});return n}
function tabAdmin(){
  let {kind,i}=dcCtx();if(kind==='dc4'&&!A.dc.dc4[i]){DCTAB='dc1';kind='dc1';i=null}
  const v=dcVals(kind,i);if(!v._init){prefillDC(kind,i);v._init=1;touch()}
  const P=kind==='dc4'?`dc.dc4.${i}`:`dc.${kind}`,sch=DCS[kind];
  let h=stepBar('admin','Dossier administratif','Formulaires de candidature pré-remplis depuis la fiche entreprise et l\u2019affaire : DC1, DC2, DC3 (acte d\u2019engagement), DC4 (sous-traitance).');
  h+=`<div class="subnav">${['dc1','dc2','dc3'].map(k=>`<button class="subt ${DCTAB===k?'on':''}" data-act="dctab" data-k="${k}">${DCS[k].t}<small>${dcPctOf(A,k)}%</small></button>`).join('')}${A.dc.dc4.map((x,j)=>`<button class="subt ${DCTAB==='dc4:'+j?'on':''}" data-act="dctab" data-k="dc4:${j}">DC4 · ${esc(x._st?.societe||'sous-traitant')}<small>${dcPctOf(A,'dc4',j)}%</small></button>`).join('')}<button class="subt add" data-act="dc4add">${ic('plus',14)} DC4 sous-traitant</button></div>`;
  h+=`<div class="row" style="margin-bottom:10px;flex-wrap:wrap"><b style="font-size:15px">${sch.t} — ${esc(sch.l)}</b><span class="sp"></span><button class="btn" data-act="dcFill">${ic('refresh',15)} Compléter les champs vides</button><button class="btn" data-act="dcReset" title="Écrase les champs pré-remplissables avec la fiche entreprise / l'affaire">${ic('reset',15)} Tout re-préremplir</button><button class="btn" data-act="entOpen">${ic('building',15)} Fiche entreprise</button>${kind==='dc4'?`<button class="btn danger" data-act="dc4del">${ic('trash',15)} Supprimer ce DC4</button>`:''}<button class="btn pri" data-act="dcPrint">${ic('print',15)} Imprimer / PDF</button></div>`;
  if(!IDX.entreprise.raison)h+=`<div class="card warncard" style="display:flex;gap:8px;align-items:center">${ic('warn',18)}<span>La fiche entreprise est vide : remplissez-la une fois (bouton « Fiche entreprise ») pour pré-remplir automatiquement tous les formulaires.</span></div>`;
  let open=false;
  sch.f.forEach(f=>{if(f[0]==='S'){if(open)h+='</div></div>';h+=`<div class="dcsec"><div class="dcst"><span>${f[1]}</span>${esc(f[2])}</div><div class="fgrid">`;open=true;return}h+=dcField(f,P,v)});
  if(open)h+='</div></div>';
  return h;
}
function dcField(f,P,v){
  const [k,l,t,,x]=f,val=v[k],p=`${P}.${k}`;
  switch(t){
    case 't':return `<label class="f"><span>${esc(l)}</span><input data-b="${p}" value="${esc(val??'')}"></label>`;
    case 'n':return `<label class="f"><span>${esc(l)}</span><input class="num" data-b="${p}" data-rr="calc" value="${esc(val??'')}"></label>`;
    case 'd':return `<label class="f"><span>${esc(l)}</span><input type="date" data-b="${p}" value="${esc(val??'')}"></label>`;
    case 'ta':return `<label class="f c2"><span>${esc(l)}</span><textarea data-b="${p}" rows="${String(val||'').split('\n').length>2?5:3}">${esc(val??'')}</textarea></label>`;
    case 'c':return `<label class="chk c2"><input type="checkbox" data-b="${p}" ${val?'checked':''}><span>${esc(l)}</span></label>`;
    case 'r':return `<div class="f c2"><span>${esc(l)}</span><div class="radios">${x.map(o=>`<label><input type="radio" name="${p}" data-b="${p}" value="${esc(o)}" ${val===o?'checked':''}> ${esc(o)}</label>`).join('')}</div></div>`;
    case 'g':{if(!Array.isArray(val))v[k]=[{},{},{}];const rows=v[k];return `<div class="f c2"><span>${esc(l)}</span><table class="tbl"><thead><tr>${x.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map((r,ri)=>`<tr>${x.map(c=>`<td><input data-b="${p}.${ri}.${c[0]}" value="${esc(r[c[0]]??'')}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    case 'calc':return `<div class="f"><span>${esc(l)}</span><div class="calc" data-calc="${k}"></div></div>`;
    case 'note':return `<div class="note c2">${esc(l)}</div>`;
  }return '';
}
function updCalc(){const {kind,i}=dcCtx();const v=dcVals(kind,i);if(!v)return;$$('[data-calc]').forEach(el=>{const f=DCS[kind].f.find(x=>x[0]===el.dataset.calc);if(f)el.textContent=f[4](v)})}

function printDC(){
  const {kind,i}=dcCtx(),sch=DCS[kind],v=dcVals(kind,i);

    const [k,l,t,,x]=f,val=v[k];
    if(t==='c')h+=`<div class="pf">${val?'☒':'☐'} ${esc(l)}</div>`;
    else if(t==='r')h+=`<div class="pf"><div class="pl">${esc(l)}</div>${x.map(o=>`<span style="margin-right:14px">${val===o?'☒':'☐'} ${esc(o)}</span>`).join('')}</div>`;
    else if(t==='g')h+=`<div class="pf"><div class="pl">${esc(l)}</div><table><tr>${x.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr>${(val||[]).map(r=>`<tr>${x.map(c=>`<td>${esc(r[c[0]]??'')}</td>`).join('')}</tr>`).join('')}</table></div>`;
    else if(t==='calc')h+=`<div class="pf"><div class="pl">${esc(l)}</div><div class="pv">${x(v)}</div></div>`;
    else if(t==='note')h+=`<div class="pf" style="min-height:60px"><i>${esc(l)}</i></div>`;

  if(open)h+='</div>';

  doPrint(h,`${sch.t} — ${A.deno.nom}`);
}

  `<h2>Avancement des étapes</h2><table><tr>${STEPS.map(st=>`<th>${st.l}</th>`).join('')}</tr><tr>${STEPS.map(st=>`<td>${{done:'Terminée',prog:'En cours',todo:'À faire'}[stepState(a,st)]}</td>`).join('')}</tr></table>`+
  `<h2>Étude préliminaire</h2><table>${a.prelim.items.map(i=>`<tr><th style="width:32%">${esc(i.l)}</th><td style="width:12%">${{oui:'Oui',non:'Non',nc:'À déterminer'}[i.v]||'—'}</td><td style="white-space:pre-wrap">${esc(i.txt||'')}</td></tr>`).join('')}</table>`+
  `<h2>Consultation des prix</h2>${a.prix.cats.filter(c=>c.rows.length).map(c=>`<b>${esc(c.l)}</b><table><tr><th>Fournisseur</th><th>Produit</th><th>U</th><th>Qté</th><th>PU HT</th><th>Total HT</th><th>Statut</th></tr>${c.rows.map(r=>`<tr><td>${esc(r.f)}</td><td>${esc(r.p)}</td><td>${esc(r.u)}</td><td>${esc(r.q)}</td><td>${r.pu?eur(num(r.pu)):''}</td><td>${num(r.q)*num(r.pu)?eur(num(r.q)*num(r.pu)):''}</td><td>${PRIX_ST[r.st]||''}</td></tr>`).join('')}</table>`).join('')||'<p>Aucune consultation.</p>'}`+
  `<h2>Métré${a.metre.map?' — Mapulator : '+esc(a.metre.map.name):''}</h2>${a.metre.rows.length?`<table><tr><th>Désignation</th><th>U</th><th>Quantité</th><th>PU HT</th><th>Total HT</th></tr>${a.metre.rows.map(r=>`<tr><td>${esc(r.des)}</td><td>${esc(r.u)}</td><td>${qfmt(num(r.q))}</td><td>${r.pu?eur(num(r.pu)):''}</td><td>${num(r.q)*num(r.pu)?eur(num(r.q)*num(r.pu)):''}</td></tr>`).join('')}<tr><th colspan="4">Total HT</th><th>${eur(metreTotal(a))}</th></tr></table>`:'<p>Aucun poste.</p>'}`+
  `<h2>Documents liés</h2>${a.docs.length?`<table><tr><th>Catégorie</th><th>Désignation</th><th>Statut</th><th>Attendu pour</th><th>Reçu le</th><th>Note</th></tr>${a.docs.map(x=>`<tr><td>${DOC_CAT[x.cat]||''}</td><td>${esc(x.nom)}${x.file?' (fichier joint)':''}</td><td>${DOC_ST[x.st][0]}</td><td>${fmtD(x.pour)}</td><td>${fmtD(x.recu)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table>`:'<p>Aucun document suivi.</p>'}`+
  `<h2>Dossier administratif</h2><table>${['dc1','dc2','dc3'].map(k=>`<tr><th style="width:32%">${DCS[k].t}</th><td>${dcPctOf(a,k)} % renseigné</td></tr>`).join('')}${a.dc.dc4.map((x,i)=>`<tr><th>DC4 — ${esc(x._st?.societe||'')}</th><td>${dcPctOf(a,'dc4',i)} % renseigné</td></tr>`).join('')}</table>`;
  const todos=[];a.events.forEach(e=>{if(e.type==='todo')e.items.forEach(it=>{if(!it.done)todos.push(esc(it.t)+' <i>('+esc(e.titre)+')</i>')})});
  h+=`<h2>Tâches ouvertes</h2>${todos.length?'<ul>'+todos.map(t=>`<li>${t}</li>`).join('')+'</ul>':'<p>Aucune.</p>'}`;
  if(d.notes)h+=`<h2>Notes</h2><div>${d.notes}</div>`;
  h+=`<div class="pfoot">MOMOwork — rapport de suivi d'affaire</div></div>`;
  doPrint(h,'Rapport — '+d.nom);
}

async function editContact(c){

  const F=[['societe','Société'],['nom','Nom prénom'],['tel','Téléphone'],['mail','Mail'],['adresse','Adresse'],...(CTAB==='clients'?[['secteur','Secteur d\u2019activité']]:[]),...(CTAB!=='clients'?[['siret','SIRET']]:[])];

  if(!ok)return;const L0=IDX.carnet[CTAB];const i=L0.findIndex(x=>x.id===c.id);if(i<0)L0.push(c);else L0[i]=c;markIdx();renderDrawer();
}
function upsertContact(sec,c){if(!c||!(c.societe||c.contact||c.nom))return;const L0=IDX.carnet[sec];const key=x=>(x.mail||'').toLowerCase()||((x.societe||'')+'|'+(x.nom||'')).toLowerCase();
  const nc={nom:c.contact||c.nom||'',societe:c.societe||'',tel:c.tel||'',mail:c.mail||'',secteur:c.secteur||'',adresse:c.adresse||''};
  const ex=L0.find(x=>key(x)===key(nc))||(nc.societe&&L0.find(x=>x.societe&&x.societe.toLowerCase()===nc.societe.toLowerCase()&&(!x.nom||!nc.nom||x.nom===nc.nom)));
  if(ex){let ch=false;for(const f in nc)if(nc[f]&&!ex[f]){ex[f]=nc[f];ch=true}if(ch)markIdx()}else{L0.push({id:uid('C-'),fav:false,...nc});markIdx()}}

$('#btnGuide').onclick=()=>modal({title:ic('help',18)+' Guide MOMOwork',wide:true,body:`<div class="guide">
<h3>Principe</h3><p>La carte n'affiche que les <b>points</b> des affaires (index léger). Le dossier complet d'une affaire — étapes, documents joints, DC, métré — n'est <b>chargé qu'au clic</b> sur son point, depuis son propre fichier .mmw.</p>
<h3>Sauvegarde</h3><ul><li><b>Nouvelle sauvegarde</b> : choisissez un dossier de travail. MOMOwork y écrit <code>MOMOwork.mmw</code> (index : points, carnet, fiche entreprise) et un sous-dossier <code>affaires/</code> avec un .mmw par affaire. L'entrée se grise et affiche une coche verte une fois active.</li><li><b>Sauvegarde auto</b> : réglable en minutes ou en heures (0 = désactivée). Le point orange sur la disquette signale des modifications en attente.</li><li><b>Sauvegarde manuelle</b> : crée un fichier complet daté <code>MOMOwork_save-manuelle_….mmw</code> à côté de la sauvegarde auto (rechargeable via « Charger un fichier .mmw »).</li><li>Au redémarrage, le navigateur peut redemander l'accès au dossier : un clic sur une affaire ou sur « Reconnecter » suffit.</li><li>Sans Chrome/Edge, les données restent dans le navigateur ; utilisez Exporter / Charger pour les fichiers.</li></ul>
<h3>Carte</h3><p>Pins par état : ${Object.values(ETATS).map(v=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><span class="rpin" style="background:${v.c};color:#fff;width:20px;height:20px">${ic(v.e,12)}</span>${v.l}</span>`).join('')}<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px"><span class="rpin" style="background:#38BDF8;color:#fff;width:20px;height:20px">${ic('clock',12)}</span>AO répondu</span><span style="display:inline-flex;align-items:center;gap:4px"><span class="rpin" style="background:#F4C20D;color:#fff;width:20px;height:20px">${ic('search',12)}</span>À valider</span>. Le tag « Appel d'offre » cycle : tous → non répondus → à valider → répondus → masqués. Palette de gauche : fonds OSM / Esri / OpenTopoMap / IGN, surcouches cadastre / pentes / communes, cotes et aires.</p>
<h3>Rapport de suivi</h3><p>Le clic sur un point ouvre le rapport : échéance, avancement des 6 étapes (Dénomination → Étude préliminaire → Consultation des prix → Métré → Dossier administratif → Remise), documents liés, tâches, météo. Chaque onglet d'étape a son bouton « Marquer l'étape terminée ». « Rapport PDF » l\u2019imprime.</p>
<h3>Métré — Mapulator intégré</h3><p>L'onglet Métré contient Mapulator complet. Chargez le plan (Setup), calez l'échelle et tracez vos VRD, tranchées, surfaces, terrassements et pointages : le projet est enregistré <b>dans le fichier de l'affaire</b> au fil des modifications. Les quantités arrivent dans « Σ Postes &amp; prix » où vous saisissez les prix unitaires ; le total alimente le DC3. « Importer un .map » reprend un ancien projet Mapulator, « Exporter le .map » le ressort.</p><h3>MOMOtion Flow</h3><p>Sauvegarde › Charger un fichier accepte les sauvegardes <code>.MTF</code> (et <code>.json</code>) de MOMOtion Flow : les affaires sont ajoutées avec leur position, client, échéance, statut, to-do, documents, tableurs et pièces jointes ; le carnet est fusionné. Réimporter un .MTF plus récent met à jour les mêmes affaires sans toucher à ce qui a été fait dans MOMOwork.</p>
<h3>DC1 · DC2 · DC3 · DC4</h3><p>Remplissez une fois la fiche entreprise : les formulaires de chaque affaire se pré-remplissent (acheteur, objet, identité, CA, effectifs, RIB…). Un DC4 par sous-traitant, choisi dans le carnet. Impression en PDF au format du modèle.</p>
<h3>Raccourcis</h3><p><b>Ctrl+S</b> enregistrer · <b>Échap</b> fermer / annuler l'outil.</p></div>`});

  <rect class="cable" x="1071" y="-140" width="6" height="1" fill="#6b7280"/>

function buildSplash(){
  $('#workBlocks').innerHTML=WORKFL.map((d,i)=>`<path class="fl fl${i+1}" fill="#9D00C2" fill-rule="evenodd" d="${d}"/>`).join('');
  $('#crane').innerHTML=craneSVG();
  $('#app-logo').innerHTML=wordmarkSVG();

/* Animation : les deux M se superposent, la grue arrive et pose W, O, R, K étage par étage */
function runSplash(){
  const sp=$('#splash');if(!sp)return Promise.resolve();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!Element.prototype.animate){$$('#splash .fl').forEach(f=>f.style.opacity=1);return new Promise(r=>setTimeout(r,600))}
  const crane=$('#crane'),hook=$('#hook'),cable=$('#splash .cable'),fl=$$('#splash .fl');
  const TOP=[818,549,280,11],HX=1074,HY0=-120,anims=[];
  const A=(el,kf,o)=>{const a=el.animate(kf,{fill:'forwards',easing:'cubic-bezier(.45,0,.25,1)',...o});anims.push(a);return a};
  const hookAt=y=>`translate(${HX}px,${y}px)`,cab=y=>`scaleY(${Math.max(1,y+120)})`;
  hook.style.transform=hookAt(HY0);cable.style.transform=cab(HY0);
  A(crane,[{opacity:0,transform:'translateX(420px)'},{opacity:1,transform:'none'}],{delay:350,duration:650,easing:'cubic-bezier(.2,.8,.2,1)'});
  let t=900;
  TOP.forEach((top,i)=>{
    const f=fl[i],hy=top-62,start=HY0+62-top,ys=HY0;   // le haut de l'étage pend sous le crochet
    A(f,[{opacity:0,transform:`translateY(${start}px) rotate(-1.5deg)`},{opacity:1,transform:`translateY(${start}px) rotate(1.5deg)`}],{delay:t,duration:140,easing:'linear'});
    A(f,[{transform:`translateY(${start}px) rotate(1.5deg)`},{transform:'translateY(-14px) rotate(-.6deg)',offset:.82},{transform:'none'}],{delay:t+140,duration:480});
    A(hook,[{transform:hookAt(ys)},{transform:hookAt(hy-14),offset:.82},{transform:hookAt(hy)}],{delay:t+140,duration:480});
    A(cable,[{transform:cab(ys)},{transform:cab(hy-14),offset:.82},{transform:cab(hy)}],{delay:t+140,duration:480});
    A(hook,[{transform:hookAt(hy)},{transform:hookAt(HY0)}],{delay:t+640,duration:260});
    A(cable,[{transform:cab(hy)},{transform:cab(HY0)}],{delay:t+640,duration:260});
    t+=720;
  });
  A(crane,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(480px)'}],{delay:t+80,duration:520,easing:'cubic-bezier(.6,0,.8,.3)'});
  const total=t+650;
  return new Promise(res=>{let done=false;const end=()=>{if(done)return;done=true;anims.forEach(a=>a.finish());res()};
    setTimeout(end,total);
    ['mousedown','keydown','touchstart','wheel'].forEach(ev=>window.addEventListener(ev,end,{once:true,capture:true,passive:true}))});
}
function svgToPNG(svg,size){return new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const r=Math.min(size/img.width,size/img.height);const w=img.width*r,h=img.height*r;g.drawImage(img,(size-w)/2,(size-h)/2,w,h);res(c.toDataURL('image/png'))};img.onerror=()=>res(null);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
/* Icônes d'appli dessinées de façon synchrone (canvas + Path2D) : le manifeste est en place dès le chargement */
function makeIcon(size,{bg=true,pad=.1}={}){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  if(bg){const r=size*.2;g.beginPath();g.moveTo(r,0);g.arcTo(size,0,size,size,r);g.arcTo(size,size,0,size,r);g.arcTo(0,size,0,0,r);g.arcTo(0,0,size,0,r);g.closePath();g.fillStyle='#fff';g.fill()}
  const W=1280,H=1240,inner=size*(1-2*pad),k=Math.min(inner/W,inner/H);
  g.save();g.translate((size-W*k)/2,(size-H*k)/2);g.scale(k,k);
  const M=new Path2D(MPATH);g.fillStyle='#808080';
  g.save();g.translate(7,8);g.fill(M);g.restore();g.save();g.translate(7,385);g.fill(M);g.restore();
  g.fillStyle='#9D00C2';g.fill(new Path2D(WORKD),'evenodd');g.restore();
  return c.toDataURL('image/png');
}
function setupIcons(){
  let i192,i512,m512,fav;
  try{i192=makeIcon(192);i512=makeIcon(512);m512=makeIcon(512,{pad:.2});fav=makeIcon(64,{bg:false,pad:.02})}catch(e){console.error(e);return}
  const add=(rel,href,extra={})=>{const l=document.createElement('link');l.rel=rel;l.href=href;Object.assign(l,extra);document.head.append(l)};
  add('icon',fav,{type:'image/png'});add('apple-touch-icon',i192);
  const page=location.href.split('#')[0].split('?')[0];
  const man={id:'momowork-suivis-de-chantier',name:'MOMOwork - Suivis de chantier',short_name:'MOMOwork',description:'Suivis de chantier',lang:'fr',start_url:page,scope:page.substring(0,page.lastIndexOf('/')+1),display:'standalone',background_color:'#1f2937',theme_color:'#1f2937',
    icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'},{src:m512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  add('manifest','data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man)));
}

/* ============ Clavier & fermeture ============ */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveAll(false).then(ok=>ok&&toast('Enregistré','ok'))}
  if(e.key==='Enter'&&DRAW&&!$$('.mw-modal').length&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();finishDraw();return}
  if(e.key==='Escape'){const m=$$('.mw-modal').pop();if(m){m._close();return}if(MODE){if(DRAW){DRAW=null;TEMP.clearLayers();return}if(MODE==='move'&&MOVEA){A=MOVEA;MOVEA=null;setMode(null);showRapport()}else setMode(null);return}if($('#saveMenu').classList.contains('on'))return closeMenu();if(A)return closeRapport();if(DRAWER)openDrawer(null)}
});

/* ============ Démarrage ============ */
function hydrateIcons(r=document){$$('[data-ic]',r).forEach(el=>{if(!el.querySelector('svg'))el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic,18))})}
function renderAll(){renderFbar();renderTools();refreshMarkers();renderAnnots();if(VIEW==='list')renderList();if(VIEW==='agenda')renderAgenda();if(DRAWER)renderDrawer();updSaveUI()}
async function boot(){
  buildSplash();hydrateIcons();
  const splashDone=runSplash();
  try{await IDB.open()}catch(e){toast('Stockage du navigateur indisponible','err')}

  try{initMap()}catch(e){console.error(e);$('#map').innerHTML='<p style="padding:20px" class="mute">Carte indisponible (pas de connexion au serveur de cartes).</p>'}
  renderAll();startAuto();
  if(MAP&&!IDX.settings.center)fitAll();
  splashDone.then(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),450);
    if(Store.mode==='folder'&&!Store.granted)toast(`Cliquez sur une affaire ou sur Sauvegarde › Reconnecter pour rouvrir le dossier « ${Store.dir.name} »`);
    else if(!IDX.affaires.length)toast('Bienvenue ! Commencez par Sauvegarde › Nouvelle sauvegarde, puis « Nouvelle affaire ».');
    MAP&&MAP.invalidateSize()});
}
